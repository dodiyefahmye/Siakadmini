<script>
/* =============================================================
 * ViewsKartuUjian.html — Periode UTS/UAS & Kartu Peserta Ujian
 * Kartu seukuran kartu pelajar (85,6 × 54 mm, 10 per A4). Ruang = kelas.
 * ============================================================= */

const NAMA_BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function tglId(iso) { const p = String(iso || '').split('-'); return p.length === 3 ? (+p[2]) + ' ' + NAMA_BULAN[+p[1] - 1] + ' ' + p[0] : ''; }
function rentangTgl(a, b) {
  if (a === b) return tglId(a);
  const x = a.split('-'), y = b.split('-');
  if (x[0] === y[0] && x[1] === y[1]) return (+x[2]) + '–' + tglId(b);
  if (x[0] === y[0]) return (+x[2]) + ' ' + NAMA_BULAN[+x[1] - 1] + ' – ' + tglId(b);
  return tglId(a) + ' – ' + tglId(b);
}
// MI / MTs / MA / Madrasah → "Kepala Madrasah"
function labelKepala(sekolah) { return /^\s*(MIN?|MTsN?|MAN?|madrasah)\b/i.test(sekolah || '') ? 'Kepala Madrasah' : 'Kepala Sekolah'; }
const STATUS_PERIODE = { BERLANGSUNG: ['Berlangsung', 'success'], AKAN: ['Akan datang', 'primary'], SELESAI: ['Selesai', 'secondary'] };

function cetakKartuUjian(d, ids, denganJadwal) {
  const kartu = d.kartu.filter(c => ids.indexOf(c.user_id) >= 0);
  if (!kartu.length) return toast('Pilih minimal satu siswa', 'warning');
  const p = d.periode, kep = labelKepala(d.sekolah);
  const ttd = cls => '<div class="' + cls + '"><div>' + esc(kep) + ',</div><div class="ttd-ruang"></div>' +
    '<div class="ttd-nama">' + (d.kepala_sekolah ? esc(d.kepala_sekolah) : '&nbsp;') + '</div>' +
    (d.nip_kepala_sekolah ? '<div class="ttd-nip">NIP. ' + esc(d.nip_kepala_sekolah) + '</div>' : '') + '</div>';
  let html = '<div class="kartu-sheet">' + kartu.map(c =>
    '<div class="kartu kartu-ujian">' +
    '<div class="k-head">' + LOGO.html() + '<div class="k-head-t"><div class="k-sek">' + esc(d.sekolah || '') + '</div>' +
      '<div class="k-jud">KARTU PESERTA ' + esc(p.nama.toUpperCase()) + '</div></div></div>' +
    '<div class="k-body"><img class="k-foto" src="' + esc(fotoSrc(c.foto, c.jk)) + '" alt="">' +
    '<div class="k-info"><div class="k-nama">' + esc(c.nama) + '</div>' +
    '<table><tr><td>No. Peserta</td><td>: <b class="ku-no">' + esc(c.nomor) + '</b></td></tr>' +
    '<tr><td>NISN</td><td>: ' + esc(c.nisn) + '</td></tr>' +
    '<tr><td>Kelas/Ruang</td><td>: ' + esc(c.kelas) + '</td></tr>' +
    '<tr><td>Username</td><td>: ' + esc(c.username) + '</td></tr></table></div>' +
    ttd('ku-ttd') + '</div>' +
    '<div class="k-foot">Berlaku ' + esc(rentangTgl(p.tanggal_mulai, p.tanggal_selesai)) + ' · Wajib dibawa setiap hari ujian</div>' +
    '</div>').join('') + '</div>';
  if (denganJadwal) {
    const kelasList = [...new Map(kartu.map(c => [c.kelas_id, c.kelas])).entries()];
    html += kelasList.map(([kid, kn]) => {
      const j = (d.jadwal || {})[kid] || [];
      return '<div class="ku-jadwal">' +
        '<div class="ku-kop">' + LOGO.html() + '<div><div class="pk-sek">' + esc(d.sekolah || '') + '</div><div class="pk-sub">Tahun Ajaran ' + esc(p.tahun_ajaran) + ' · Semester ' + esc(p.semester) + '</div></div></div>' +
        '<h3>JADWAL ' + esc(p.nama.toUpperCase()) + '</h3>' +
        '<div class="ku-sub">Kelas/Ruang: <b>' + esc(kn) + '</b> · ' + esc(rentangTgl(p.tanggal_mulai, p.tanggal_selesai)) + '</div>' +
        '<table class="ku-tbl"><thead><tr><th style="width:8%">No</th><th style="width:28%">Hari, Tanggal</th><th style="width:20%">Waktu</th><th>Mata Pelajaran</th><th style="width:12%">Durasi</th></tr></thead><tbody>' +
        (j.length ? j.map((r, i) => '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(r.hari) + ', ' + esc(tglId(r.tanggal)) + '</td><td class="c">' + esc(r.mulai) + '–' + esc(r.selesai) +
          (r.selesai_tgl !== r.tanggal ? '<br><small>(s.d. ' + esc(tglId(r.selesai_tgl)) + ')</small>' : '') + '</td><td>' + esc(r.mapel) + '</td><td class="c">' + esc(r.durasi) + ' menit</td></tr>').join('')
          : '<tr><td colspan="5" class="c" style="padding:6mm">Belum ada ujian ' + esc(p.jenis) + ' (CBT) yang dijadwalkan untuk kelas ini dalam periode tersebut.</td></tr>') +
        '</tbody></table>' +
        '<ul class="ku-catatan"><li>Bawa kartu peserta setiap hari ujian dan tunjukkan kepada pengawas.</li><li>Login CBT memakai username pada kartu dan password akun masing-masing.</li>' +
        '<li>Hadir paling lambat 15 menit sebelum ujian dimulai.</li></ul>' +
        ttd('ku-ttd-a4') + '</div>';
    }).join('');
  }
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.innerHTML = html;
  document.body.classList.add('cetak-kartu');
  const selesai = () => { document.body.classList.remove('cetak-kartu'); window.removeEventListener('afterprint', selesai); };
  window.addEventListener('afterprint', selesai);
  toast('Menyiapkan ' + kartu.length + ' kartu ujian… Pilih kertas A4, skala 100%, centang "Background graphics".', 'info');
  setTimeout(() => { window.print(); setTimeout(selesai, 1500); }, 600);
}

/** Dialog cetak: pilih kelas → daftar siswa bernomor peserta (bisa dipilih sebagian untuk cetak ulang) */
async function cetakKartuUjianDlg(per) {
  await getMaster();
  const kelasBoleh = S.user.role === 'admin' ? kelasOpts() : kelasOpts().filter(k => (S.user.wali_kelas || []).indexOf(k[0]) >= 0);
  if (!kelasBoleh.length) return toast('Anda bukan wali kelas', 'warning');
  let data = null;
  const el = modal({
    title: 'Cetak Kartu Ujian – ' + per.nama, size: 'lg',
    body: '<div class="row g-2 align-items-end mb-2"><div class="col-md-6"><label class="form-label small fw-semibold mb-1" for="kuKelas">Kelas</label>' +
      '<select class="form-select" id="kuKelas">' + optionsHtml(kelasBoleh, kelasBoleh.length === 1 ? kelasBoleh[0][0] : '', '— pilih kelas —') + '</select></div>' +
      '<div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" id="kuJadwal" checked>' +
      '<label class="form-check-label" for="kuJadwal">Sertakan lembar jadwal ujian kelas (1 halaman A4)</label></div></div></div>' +
      '<p class="small text-muted mb-2">Ukuran kartu pelajar (8,5 × 5,4 cm), 10 kartu per A4. Nomor peserta dibuat sekali dan tetap sama saat dicetak ulang. ' +
      'Untuk kartu hilang, cukup centang siswa tersebut saja.</p>' +
      '<div id="kuList"></div>',
    footer: '<button class="btn btn-light" data-bs-dismiss="modal">Tutup</button><button class="btn btn-primary" id="kuCetak" disabled><i class="bi bi-printer"></i> Cetak</button>'
  });
  const list = $('#kuList', el), btn = $('#kuCetak', el);
  const hitung = () => { const n = $$('.ku-cb:checked', el).length; btn.disabled = !n; btn.innerHTML = '<i class="bi bi-printer"></i> Cetak ' + n + ' kartu'; };
  async function muat() {
    const k = $('#kuKelas', el).value; data = null; btn.disabled = true;
    if (!k) { list.innerHTML = ''; return; }
    list.innerHTML = spinner();
    try { data = await api('kartuUjian', { periode_id: per.id, kelas_id: k }, { silent: true }); }
    catch (e) { list.innerHTML = '<div class="alert alert-danger small">' + esc(e.message) + '</div>'; return; }
    const nJ = ((data.jadwal || {})[k] || []).length;
    list.innerHTML = (data.kartu.length ? '<div class="small mb-2 ' + (nJ ? 'text-success' : 'text-warning') + '"><i class="bi bi-calendar-check"></i> ' +
        (nJ ? nJ + ' ujian ' + esc(per.jenis) + ' (CBT) terjadwal untuk kelas ini.' : 'Belum ada ujian ' + esc(per.jenis) + ' (CBT) untuk kelas ini dalam periode tersebut — lembar jadwal akan kosong.') + '</div>' +
      '<div class="table-responsive" style="max-height:340px"><table class="table table-sm align-middle mb-0"><thead class="table-light"><tr>' +
      '<th style="width:36px"><input class="form-check-input" type="checkbox" id="kuAll" checked title="Pilih semua"></th><th>No. Peserta</th><th>Nama</th><th>NISN</th><th>Foto</th></tr></thead><tbody>' +
      data.kartu.map(c => '<tr><td><input class="form-check-input ku-cb" type="checkbox" value="' + esc(c.user_id) + '" checked></td><td class="font-monospace small">' + esc(c.nomor) + '</td>' +
        '<td>' + esc(c.nama) + '</td><td class="small">' + esc(c.nisn) + '</td><td>' + (c.foto ? badge('Ada', 'success') : badge('Dummy', 'secondary')) + '</td></tr>').join('') +
      '</tbody></table></div>' : emptyState('Tidak ada siswa aktif di kelas ini'));
    const all = $('#kuAll', el);
    if (all) all.onchange = e => { $$('.ku-cb', el).forEach(c => { c.checked = e.target.checked; }); hitung(); };
    $$('.ku-cb', el).forEach(c => c.onchange = () => { if (all) all.checked = $$('.ku-cb:not(:checked)', el).length === 0; hitung(); });
    hitung();
  }
  $('#kuKelas', el).onchange = muat;
  btn.onclick = () => {
    if (!data) return;
    const ids = $$('.ku-cb:checked', el).map(c => c.value), jd = $('#kuJadwal', el).checked;
    closeModal(); later(() => cetakKartuUjian(data, ids, jd), 400);
  };
  if (kelasBoleh.length === 1) muat();
}

VIEWS.kartuUjian = {
  title: 'Kartu Ujian',
  render: async function (el) {
    const admin = S.user.role === 'admin';
    el.innerHTML = pageHead('Kartu Ujian', 'Kartu peserta UTS/UAS seukuran kartu pelajar. Buat periode ujian, lalu cetak per kelas.',
      '<button class="btn btn-light btn-sm" data-act="back"><i class="bi bi-arrow-left"></i> Ujian / CBT</button>' +
      (admin ? '<button class="btn btn-primary btn-sm" data-act="add"><i class="bi bi-plus-lg"></i> Periode UTS/UAS</button>' : '')) +
      '<div id="kuInfo"></div><div id="kuPer">' + spinner() + '</div>';
    let rows = [];
    async function load() {
      rows = await api('listPeriodeUjian', {}, { silent: true });
      if (admin) {
        const st = await api('getSettings', {}, { silent: true });
        $('#kuInfo', el).innerHTML = st.kepala_sekolah ? '' : '<div class="alert alert-warning small py-2"><i class="bi bi-pen"></i> Nama kepala sekolah/madrasah untuk tanda tangan kartu belum diisi. ' +
          '<a href="#" data-act="pengaturan">Isi di Pengaturan → Identitas</a>.</div>';
      }
      $('#kuPer', el).innerHTML = rows.length ? '<div class="row g-3">' + rows.map(p => {
        const stt = STATUS_PERIODE[p.status] || ['', 'secondary'];
        return '<div class="col-md-6 col-xl-4"><div class="card h-100' + (p.status === 'BERLANGSUNG' ? ' border-success' : '') + '"><div class="card-body">' +
          '<div class="d-flex justify-content-between align-items-start mb-1"><span class="badge text-bg-dark">' + esc(p.jenis) + '</span>' + badge(stt[0], stt[1]) + '</div>' +
          '<h5 class="mb-1">' + esc(p.nama) + '</h5><div class="small text-muted mb-2"><i class="bi bi-calendar-range"></i> ' + esc(rentangTgl(p.tanggal_mulai, p.tanggal_selesai)) + '</div>' +
          '<div class="small">' + p.jumlah_ujian + ' ujian ' + esc(p.jenis) + ' (CBT) dalam periode · ' + p.jumlah_peserta + ' siswa sudah bernomor peserta</div></div>' +
          '<div class="card-footer bg-transparent d-flex gap-2 flex-wrap">' + actBtn('cetak', p.id, 'printer', 'Cetak Kartu', 'primary') +
          (admin ? actBtn('edit', p.id, 'pencil', 'Ubah') + actBtn('del', p.id, 'trash', 'Hapus', 'outline-danger') : '') + '</div></div></div>';
      }).join('') + '</div>'
        : emptyState(admin ? 'Belum ada periode UTS/UAS. Klik "Periode UTS/UAS" untuk membuat.' : 'Belum ada periode UTS/UAS. Hubungi admin.', 'person-vcard');
    }
    const form = p => formModal({
      title: p ? 'Ubah Periode Ujian' : 'Periode UTS/UAS Baru',
      intro: '<p class="small text-muted">Ujian CBT berjenis sama yang dimulai dalam rentang tanggal ini otomatis masuk ke lembar jadwal kartu.</p>',
      values: Object.assign({ jenis: 'UAS', nama: '' }, p || {}),
      fields: [
        { name: 'id', type: 'hidden' },
        { name: 'jenis', label: 'Jenis', type: 'select', placeholder: false, options: [['UTS', 'UTS (Penilaian Tengah Semester)'], ['UAS', 'UAS (Penilaian Akhir Semester)']], col: 'col-md-5' },
        { name: 'nama', label: 'Nama periode', col: 'col-md-7', placeholder: 'Otomatis, mis. UAS Ganjil ' + (S.settings.tahun_ajaran || '') },
        { name: 'tanggal_mulai', label: 'Tanggal mulai', type: 'date', required: true, col: 'col-md-6' },
        { name: 'tanggal_selesai', label: 'Tanggal selesai', type: 'date', required: true, col: 'col-md-6' }
      ],
      onSubmit: async d => { await api('savePeriodeUjian', d); toast('Periode disimpan', 'success'); load(); }
    });
    bindActs(el, {
      back: () => navigate('ujianGuru'), add: () => form(), pengaturan: () => navigate('pengaturan'),
      edit: id => form(rows.find(r => r.id === id)),
      cetak: id => cetakKartuUjianDlg(rows.find(r => r.id === id)),
      del: async id => {
        const p = rows.find(r => r.id === id);
        if (await confirmDlg('Hapus periode "' + p.nama + '"? Nomor peserta periode ini ikut terhapus (ujian CBT tidak terhapus).', 'Hapus', 'danger')) {
          await api('hapusPeriodeUjian', { id }); toast('Periode dihapus', 'success'); load();
        }
      }
    });
    load();
  }
};
</script>

<script>
/* =============================================================
 * ExamMode.html — Mesin ujian CBT di HP siswa + lapisan keamanan
 * -------------------------------------------------------------
 * Keamanan yang diterapkan:
 *  1. Mode layar penuh (Fullscreen API). Keluar fullscreen = pelanggaran.
 *  2. Deteksi pindah tab/aplikasi: visibilitychange, blur, pagehide.
 *  3. Pelanggaran dicatat ke server; melewati batas → sesi DIKUNCI (hanya guru yang bisa membuka).
 *  4. Blokir klik kanan, seleksi teks, copy/cut/paste, drag, shortcut (Ctrl+C/V/U/P/S, F12, PrintScreen).
 *  5. Deteksi perubahan lebar layar (split-screen / jendela mengambang).
 *  6. Tombol "kembali" browser dinonaktifkan; peringatan saat menutup halaman.
 *  7. Watermark nama & NIS di latar soal (menghambat penyebaran screenshot).
 *  8. Timer mengikuti jam server; autosave + cadangan lokal (tahan koneksi putus).
 * CATATAN: browser tidak bisa MEMBLOKIR siswa membuka aplikasi lain di HP.
 *          Yang dilakukan: mendeteksi, mencatat, mengunci. Lihat README untuk opsi exam browser.
 * ============================================================= */

const Exam = {
  d: null, cur: 0, ans: {}, ragu: {}, pending: {}, violQ: [],
  inflight: false, offset: 0, started: false, locked: false, ended: false, submitting: false,
  lastViol: 0, baseW: 0, fsWanted: false, fsTrans: false, orientT: 0,
  L: [], tickId: null, flushT: null, pollId: null, syncId: null, blurT: null, esaiT: null,

  /* ---------- siklus hidup ---------- */
  reset() {
    this.removeGuards();
    clearInterval(this.tickId); clearInterval(this.pollId); clearInterval(this.syncId);
    clearTimeout(this.flushT); clearTimeout(this.blurT); clearTimeout(this.esaiT);
    Object.assign(this, { d: null, cur: 0, ans: {}, ragu: {}, pending: {}, violQ: [], inflight: false, offset: 0, started: false,
      locked: false, ended: false, submitting: false, lastViol: 0, fsWanted: false, tickId: null, pollId: null, syncId: null });
    ['#exam', '#examOv', '#examPanel'].forEach(s => { const e = $(s); if (e) e.remove(); });
    document.body.classList.remove('exam-mode');
  },

  open(p) {
    this.reset();
    this.d = p;
    this.ans = Object.assign({}, p.jawaban || {});
    // gabungkan cadangan lokal (jawaban yang belum sempat terkirim)
    const bak = store.get('exam_' + p.sesi_id);
    if (bak && bak.ans) {
      Object.keys(bak.ans).forEach(k => { if (this.ans[k] !== bak.ans[k]) { this.ans[k] = bak.ans[k]; this.pending[k] = bak.ans[k]; } });
      this.ragu = bak.ragu || {};
      this.cur = Math.min(bak.cur || 0, p.soal.length - 1);
    }
    this.offset = p.server_ms - Date.now();
    this.mount();
    if (p.status === 'DIKUNCI') { this.started = true; this.attachGuards(); this.startTimer(); this.render(); this.showLocked(); return; }
    this.showRules();
  },

  begin() {
    this.started = true;
    this.lastViol = Date.now();
    this.hideOv();
    this.attachGuards();
    this.startTimer();
    this.render();
    this.scheduleFlush(300);
    this.syncId = setInterval(() => this.periodicSync(), 45000);
  },

  close() { this.reset(); navigate('ujianSiswa'); },
  forceClose() { if (this.d) { this.ended = true; this.exitFs(); this.reset(); } },

  /* ---------- tampilan ---------- */
  mount() {
    document.body.classList.add('exam-mode');
    const d = this.d;
    const wm = '<svg xmlns="http://www.w3.org/2000/svg" width="280" height="150"><text x="20" y="90" transform="rotate(-22 140 75)" font-family="sans-serif" font-size="15" fill="#000">' +
      esc(d.siswa.nama) + ' • ' + esc(d.siswa.username) + '</text></svg>';
    const ex = document.createElement('div');
    ex.id = 'exam';
    ex.innerHTML =
      '<div class="exam-head"><div class="title"><div class="fw-bold">' + esc(d.ujian.judul) + '</div><div class="small opacity-75">' + esc(d.siswa.nama) + ' · ' + esc(d.siswa.username) +
      ' · <span id="exProg"></span></div></div>' +
      '<div class="text-end"><div class="exam-timer" id="exTimer">--:--</div><div class="save-ind mt-1"><span id="exSave">✓ Tersimpan</span> · <span id="exViol"></span></div></div></div>' +
      '<div class="exam-body" id="exBody"><div class="exam-watermark" style="background-image:url(&quot;data:image/svg+xml;utf8,' + encodeURIComponent(wm) + '&quot;)"></div>' +
      '<div class="exam-inner" id="exQ"></div></div>' +
      '<div class="exam-foot"><button class="btn btn-light" id="exPrev"><i class="bi bi-chevron-left"></i><span class="d-none d-sm-inline"> Sebelumnya</span></button>' +
      '<button class="btn btn-outline-warning" id="exRagu"><i class="bi bi-flag"></i> Ragu</button>' +
      '<button class="btn btn-outline-secondary" id="exList"><i class="bi bi-grid-3x3-gap"></i></button>' +
      '<button class="btn btn-primary" id="exNext"><span class="d-none d-sm-inline">Berikutnya </span><i class="bi bi-chevron-right"></i></button></div>';
    document.body.appendChild(ex);
    $('#exPrev').onclick = () => this.go(this.cur - 1);
    $('#exNext').onclick = () => { if (this.cur < this.d.soal.length - 1) this.go(this.cur + 1); else this.showPanel(); };
    $('#exRagu').onclick = () => { const id = this.d.soal[this.cur].id; this.ragu[id] = !this.ragu[id]; this.backup(); this.render(); };
    $('#exList').onclick = () => this.showPanel();
    this.updateViol();
  },

  go(i) {
    if (i < 0 || i >= this.d.soal.length) return;
    this.cur = i;
    this.backup();
    this.render();
  },

  render() {
    if (!this.d || !$('#exQ')) return;
    const q = this.d.soal[this.cur], n = this.d.soal.length, val = this.ans[q.id] || '';
    let h = '<div class="d-flex justify-content-between align-items-center mb-3"><span class="badge text-bg-primary fs-6">Soal ' + q.no + ' / ' + n + '</span>' +
      '<span class="badge text-bg-light border">' + esc(TIPE_LABEL[q.tipe] || q.tipe) + '</span></div>' +
      '<div class="exam-q mb-3">' + esc(q.pertanyaan) + '</div>' +
      (q.gambar_url ? '<img class="exam-q-img" draggable="false" src="' + esc(driveImg(q.gambar_url)) + '">' : '');
    if (q.tipe === 'ESAI') {
      h += '<textarea class="form-control" id="exEsai" rows="8" placeholder="Tulis jawabanmu di sini…" autocomplete="off" autocorrect="off" spellcheck="false">' + esc(val) + '</textarea>' +
        '<div class="small text-muted mt-1">Jawaban tersimpan otomatis.</div>';
    } else {
      h += q.opsi.map((o, i) => '<div class="opsi-item' + (val === o.k ? ' selected' : '') + '" data-k="' + esc(o.k) + '"><div class="opsi-label">' +
        (q.tipe === 'BS' ? o.k : 'ABCDE'.charAt(i)) + '</div><div class="opsi-text">' + esc(o.t) + '</div></div>').join('');
    }
    $('#exQ').innerHTML = h;
    $$('.opsi-item', $('#exQ')).forEach(it => it.onclick = () => {
      const k = it.dataset.k;
      this.setAnswer(q.id, this.ans[q.id] === k ? '' : k); // ketuk lagi = batal pilih
      this.render();
    });
    const ta = $('#exEsai');
    if (ta) ta.oninput = () => { clearTimeout(this.esaiT); this.esaiT = setTimeout(() => this.setAnswer(q.id, ta.value), 700); };
    $('#exPrev').disabled = this.cur === 0;
    $('#exNext').innerHTML = this.cur === n - 1 ? '<i class="bi bi-check2-square"></i> Selesai' : '<span class="d-none d-sm-inline">Berikutnya </span><i class="bi bi-chevron-right"></i>';
    $('#exNext').className = 'btn ' + (this.cur === n - 1 ? 'btn-success' : 'btn-primary');
    $('#exRagu').className = 'btn ' + (this.ragu[q.id] ? 'btn-warning' : 'btn-outline-warning');
    $('#exBody').scrollTop = 0;
    this.updateProg();
  },

  answeredCount() { return this.d.soal.filter(q => String(this.ans[q.id] || '').trim() !== '').length; },
  updateProg() { const p = $('#exProg'); if (p) p.textContent = 'Terjawab ' + this.answeredCount() + '/' + this.d.soal.length; },
  updateViol() {
    const v = $('#exViol'); if (!v || !this.d) return;
    const m = this.d.ujian.maks_pelanggaran;
    v.innerHTML = '<i class="bi bi-shield-exclamation"></i> ' + (this.d.pelanggaran || 0) + (m ? '/' + m : '');
  },
  setSave(st) {
    const s = $('#exSave'); if (!s) return;
    s.textContent = st === 'ok' ? '✓ Tersimpan' : st === 'saving' ? '⟳ Menyimpan…' : '⚠ Offline, dikirim ulang otomatis';
  },

  showPanel() {
    const n = this.d.soal.length, done = this.answeredCount();
    const raguN = this.d.soal.filter(q => this.ragu[q.id]).length;
    const p = document.createElement('div');
    p.id = 'examPanel'; p.className = 'exam-panel';
    p.innerHTML = '<div class="sheet"><div class="d-flex justify-content-between align-items-center mb-3"><h6 class="mb-0 fw-bold">Daftar Soal</h6><button class="btn-close" id="pnClose"></button></div>' +
      '<div class="nomor-grid mb-3">' + this.d.soal.map((q, i) => {
        const a = String(this.ans[q.id] || '').trim() !== '';
        return '<button class="nomor-btn' + (this.ragu[q.id] ? ' ragu' : a ? ' answered' : '') + (i === this.cur ? ' current' : '') + '" data-i="' + i + '">' + q.no + '</button>';
      }).join('') + '</div>' +
      '<div class="small text-muted mb-3"><span class="badge text-bg-success">&nbsp;</span> dijawab · <span class="badge text-bg-warning">&nbsp;</span> ragu-ragu · <span class="badge border text-dark">&nbsp;</span> belum</div>' +
      '<div class="alert alert-light border small mb-3">Terjawab <b>' + done + '</b> dari ' + n + (raguN ? ' · <b>' + raguN + '</b> ragu-ragu' : '') + '</div>' +
      '<button class="btn btn-success w-100 py-2" id="pnSubmit"><i class="bi bi-send-check"></i> Kumpulkan Ujian</button></div>';
    document.body.appendChild(p);
    const close = () => p.remove();
    $('#pnClose').onclick = close;
    p.onclick = e => { if (e.target === p) close(); };
    $$('.nomor-btn', p).forEach(b => b.onclick = () => { close(); this.go(parseInt(b.dataset.i, 10)); });
    $('#pnSubmit').onclick = () => { close(); this.confirmSubmit(); };
  },

  confirmSubmit() {
    const n = this.d.soal.length, done = this.answeredCount();
    const raguN = this.d.soal.filter(q => this.ragu[q.id]).length;
    this.ov('<div class="box"><div class="big">📨</div><h4>Kumpulkan ujian sekarang?</h4>' +
      '<p>Terjawab <b>' + done + '</b> dari ' + n + ' soal.' + (n - done ? '<br><span class="text-warning">' + (n - done) + ' soal belum dijawab.</span>' : '') +
      (raguN ? '<br><span class="text-warning">' + raguN + ' soal ditandai ragu-ragu.</span>' : '') + '</p>' +
      '<p class="small opacity-75">Setelah dikumpulkan, jawaban tidak bisa diubah.</p>' +
      '<div class="d-flex gap-2"><button class="btn btn-outline-light flex-fill" id="cfBack">Periksa lagi</button><button class="btn btn-success flex-fill" id="cfGo">Ya, kumpulkan</button></div></div>', 'confirm');
    $('#cfBack').onclick = () => this.hideOv();
    $('#cfGo').onclick = () => this.submit(false);
  },

  /* ---------- overlay ---------- */
  ov(html, type) {
    let o = $('#examOv');
    if (!o) { o = document.createElement('div'); o.id = 'examOv'; o.className = 'exam-overlay'; document.body.appendChild(o); }
    o.dataset.type = type || '';
    o.innerHTML = html;
    o.style.display = 'flex';
  },
  ovType() { const o = $('#examOv'); return o && o.style.display !== 'none' ? o.dataset.type : ''; },
  hideOv() { const o = $('#examOv'); if (o) { o.style.display = 'none'; o.innerHTML = ''; o.dataset.type = ''; } },

  showRules() {
    const d = this.d, m = d.ujian.maks_pelanggaran;
    this.ov('<div class="box"><div class="big">📝</div><h4 class="fw-bold">' + esc(d.ujian.judul) + '</h4><p class="opacity-75">' + esc(d.ujian.mapel) + ' · ' + d.soal.length + ' soal</p>' +
      '<div class="text-start small bg-white text-dark rounded-3 p-3 mb-3"><b>Tata tertib ujian:</b><ol class="mb-0 ps-3 mt-1">' +
      '<li>Ujian berjalan dalam <b>layar penuh</b>. Jangan keluar dari layar penuh.</li>' +
      '<li><b>Jangan</b> pindah aplikasi/tab, membuka notifikasi, split-screen, atau mematikan layar.</li>' +
      '<li>Setiap pelanggaran dicatat dan dilihat pengawas.' + (m ? ' Setelah <b>' + m + ' pelanggaran</b>, ujian <b>dikunci</b>.' : '') + '</li>' +
      '<li>Jawaban tersimpan otomatis. Jika koneksi putus, lanjutkan saja — akan dikirim ulang.</li>' +
      '<li>Waktu mengikuti jam server dan sudah berjalan. Ujian terkumpul otomatis saat waktu habis.</li></ol></div>' +
      '<div class="form-check text-start mb-3"><input type="checkbox" class="form-check-input" id="exAgree"><label class="form-check-label" for="exAgree">Saya memahami tata tertib dan akan mengerjakan dengan jujur.</label></div>' +
      '<button class="btn btn-warning btn-lg w-100 fw-bold" id="exGo" disabled>Mulai Mengerjakan</button>' +
      '<button class="btn btn-link text-white-50 mt-2" id="exCancel">Kembali</button></div>', 'rules');
    $('#exAgree').onchange = e => { $('#exGo').disabled = !e.target.checked; };
    $('#exGo').onclick = async () => {
      await this.enterFs();
      if (!this.fsWanted) toast('Layar penuh tidak didukung perangkat ini. Pengawasan pindah aplikasi tetap aktif.', 'warning');
      this.begin();
    };
    $('#exCancel').onclick = () => this.close();
  },

  showWarn(ket) {
    const m = this.d.ujian.maks_pelanggaran;
    this.ov('<div class="box"><div class="big">⚠️</div><h4 class="fw-bold">Pelanggaran Tercatat</h4><p>' + esc(ket) + '</p>' +
      '<p class="fs-5">Pelanggaran: <b>' + (this.d.pelanggaran || 0) + (m ? ' / ' + m : '') + '</b></p>' +
      (m ? '<p class="small opacity-75">Jika mencapai batas, ujian otomatis dikunci dan hanya pengawas yang dapat membukanya.</p>' : '') +
      '<button class="btn btn-warning btn-lg w-100 fw-bold" id="exBack">Kembali ke Ujian</button></div>', 'warn');
    $('#exBack').onclick = async () => {
      if (this.fsWanted && !this.fsEl()) await this.enterFs();
      this.lastViol = Date.now();
      this.hideOv();
    };
  },

  showLocked() {
    if (this.ended) return;
    this.locked = true;
    clearTimeout(this.flushT);
    const m = this.d.ujian.maks_pelanggaran;
    this.ov('<div class="box"><div class="big">🔒</div><h4 class="fw-bold">Ujian Dikunci</h4>' +
      '<p>Kamu telah mencapai batas pelanggaran (' + (this.d.pelanggaran || 0) + (m ? '/' + m : '') + '). Jawabanmu tetap aman.</p>' +
      '<p class="small opacity-75">Hubungi pengawas/guru untuk membuka kunci. Halaman ini memeriksa status secara otomatis.</p>' +
      '<div id="exLockSt" class="small">Memeriksa status…</div></div>', 'lock');
    clearInterval(this.pollId);
    const check = async () => {
      try {
        const r = await api('cekStatusUjian', { sesi_id: this.d.sesi_id }, { silent: true, quiet: true });
        this.sync(r);
        const st = $('#exLockSt');
        if (r.status === 'BERLANGSUNG') {
          clearInterval(this.pollId); this.pollId = null;
          this.d.pelanggaran = r.pelanggaran; this.updateViol();
          if (st) {
            st.innerHTML = '<button class="btn btn-success btn-lg mt-2 w-100" id="exResume"><i class="bi bi-unlock"></i> Kunci dibuka — Lanjutkan</button>';
            $('#exResume').onclick = async () => {
              await this.enterFs();
              this.locked = false; this.lastViol = Date.now();
              this.hideOv(); this.render(); this.scheduleFlush(200);
            };
          }
        } else if (r.status === 'SELESAI') {
          clearInterval(this.pollId);
          this.finished({ info: 'Waktu habis — ujian telah dikumpulkan otomatis oleh sistem.' });
        } else if (r.status === 'RESET') {
          clearInterval(this.pollId);
          this.resetByTeacher();
        } else if (st) st.textContent = 'Masih terkunci · diperiksa ulang tiap 8 detik';
      } catch (e) { }
    };
    check();
    this.pollId = setInterval(check, 8000);
  },

  resetByTeacher() {
    this.ended = true;
    store.del('exam_' + this.d.sesi_id);
    this.removeGuards(); this.exitFs();
    this.ov('<div class="box"><div class="big">🔄</div><h4>Sesi ujian direset pengawas</h4><p>Silakan mulai ulang ujian dari daftar ujian.</p><button class="btn btn-light w-100" id="exOut">Kembali</button></div>', 'done');
    $('#exOut').onclick = () => this.close();
  },

  /* ---------- jawaban & sinkronisasi ---------- */
  setAnswer(id, val) {
    this.ans[id] = val;
    this.pending[id] = val;
    this.backup();
    this.updateProg();
    this.scheduleFlush();
  },
  backup() { if (this.d) store.set('exam_' + this.d.sesi_id, { ans: this.ans, ragu: this.ragu, cur: this.cur, t: Date.now() }); },
  scheduleFlush(ms) {
    clearTimeout(this.flushT);
    this.flushT = setTimeout(() => this.flush(), ms == null ? 1200 : ms);
  },
  sync(r) {
    if (!r) return;
    if (r.server_ms) this.offset = r.server_ms - Date.now();
    if (r.batas_ms) this.d.batas_ms = r.batas_ms;
  },
  async flush() {
    if (this.inflight || this.ended || this.locked || this.submitting || !this.d) return;
    // kirim pelanggaran yang tertunda (offline)
    if (this.violQ.length) {
      const v = this.violQ.shift();
      try { const r = await api('logPelanggaran', { sesi_id: this.d.sesi_id, jenis: v.jenis, keterangan: v.ket + ' (tertunda)' }, { silent: true, quiet: true }); this.afterViol(r); }
      catch (e) { this.violQ.unshift(v); }
    }
    const keys = Object.keys(this.pending);
    if (!keys.length) { this.setSave('ok'); return; }
    const batch = {};
    keys.forEach(k => batch[k] = this.pending[k]);
    this.inflight = true;
    this.setSave('saving');
    try {
      const r = await api('saveJawaban', { sesi_id: this.d.sesi_id, jawaban: batch }, { silent: true, quiet: true });
      if (!this.d) return;
      this.sync(r);
      if (r.saved) keys.forEach(k => { if (this.pending[k] === batch[k]) delete this.pending[k]; });
      if (r.status === 'DIKUNCI') { this.d.pelanggaran = r.pelanggaran; this.updateViol(); this.showLocked(); }
      else if (r.status === 'SELESAI') this.finished({ info: 'Ujian sudah dikumpulkan.' });
      else if (r.status === 'RESET') this.resetByTeacher();
      this.setSave(Object.keys(this.pending).length ? 'saving' : 'ok');
      if (Object.keys(this.pending).length) this.scheduleFlush(500);
    } catch (e) {
      this.setSave('offline');
      if (/waktu ujian sudah habis/i.test(e.message)) this.submit(true);
      else if (e.code !== 'AUTH') this.scheduleFlush(5000);
    } finally { this.inflight = false; }
  },
  async periodicSync() {
    if (this.ended || this.locked || this.submitting || this.inflight || !this.d) return;
    try {
      const r = await api('cekStatusUjian', { sesi_id: this.d.sesi_id }, { silent: true, quiet: true });
      this.sync(r);
      if (r.status === 'DIKUNCI') { this.d.pelanggaran = r.pelanggaran; this.updateViol(); this.showLocked(); }
      else if (r.status === 'SELESAI') this.finished({ info: 'Ujian telah dikumpulkan.' });
      else if (r.status === 'RESET') this.resetByTeacher();
    } catch (e) { }
  },

  /* ---------- timer ---------- */
  startTimer() {
    clearInterval(this.tickId);
    this.tick();
    this.tickId = setInterval(() => this.tick(), 1000);
  },
  tick() {
    if (!this.d) return;
    const rem = Math.max(0, this.d.batas_ms - (Date.now() + this.offset));
    const s = Math.floor(rem / 1000);
    const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
    const t = $('#exTimer');
    if (t) {
      t.textContent = (hh ? hh + ':' : '') + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
      t.classList.toggle('danger', s <= 300);
    }
    if (rem <= 0 && !this.ended && !this.submitting && !this.locked) this.submit(true);
  },

  /* ---------- pengumpulan ---------- */
  async submit(auto) {
    if (this.submitting || this.ended) return;
    this.submitting = true;
    clearTimeout(this.flushT); clearTimeout(this.esaiT);
    const ta = $('#exEsai');
    if (ta && this.d) this.ans[this.d.soal[this.cur].id] = ta.value;
    this.ov('<div class="box"><div class="spinner-border text-light mb-3" style="width:3rem;height:3rem"></div><h5>' + (auto ? 'Waktu habis! ' : '') + 'Mengumpulkan jawaban…</h5><p class="small opacity-75">Jangan tutup aplikasi.</p></div>', 'submit');
    for (let i = 0; i < 6; i++) {
      try {
        const r = await api('submitUjian', { sesi_id: this.d.sesi_id, jawaban: this.ans }, { silent: true, quiet: true });
        return this.finished(r);
      } catch (e) {
        if (e.code === 'AUTH') return;
        if (!e.network) {
          if (/dikunci/i.test(e.message)) { this.submitting = false; return this.showLocked(); }
          return this.finished({ error: e.message });
        }
        await sleep(3000);
      }
    }
    this.submitting = false;
    this.ov('<div class="box"><div class="big">📶</div><h5>Gagal mengirim karena koneksi</h5><p class="small">Jawabanmu tersimpan di perangkat ini dan di server (autosave terakhir). Periksa koneksi lalu coba lagi.</p>' +
      '<button class="btn btn-warning w-100" id="exRetry">Coba kirim lagi</button></div>', 'submit');
    $('#exRetry').onclick = () => this.submit(auto);
  },

  finished(r) {
    this.ended = true;
    this.submitting = false;
    clearInterval(this.tickId); clearInterval(this.pollId); clearInterval(this.syncId);
    this.removeGuards();
    this.exitFs();
    store.del('exam_' + this.d.sesi_id);
    const skor = r && r.tampilkan && r.skor !== null && r.skor !== undefined;
    this.ov('<div class="box"><div class="big">' + (r && r.error ? '⚠️' : '🎉') + '</div><h4 class="fw-bold">' + (r && r.error ? 'Ujian berakhir' : 'Ujian Selesai!') + '</h4>' +
      (r && r.error ? '<p>' + esc(r.error) + '</p>' : '') + (r && r.info ? '<p>' + esc(r.info) + '</p>' : '') +
      (skor ? '<div class="my-3"><div class="small opacity-75">Nilai kamu</div><div style="font-size:3.5rem;font-weight:800">' + fmtNum(r.skor) + '</div></div>' : (r && !r.error && !r.info ? '<p>Jawabanmu sudah terkirim. Nilai akan diumumkan oleh guru.</p>' : '')) +
      (r && r.ada_esai ? '<p class="small opacity-75">Nilai dapat berubah setelah guru menilai soal esai.</p>' : '') +
      '<button class="btn btn-light btn-lg w-100 mt-2" id="exDone">Kembali ke Daftar Ujian</button></div>', 'done');
    $('#exDone').onclick = () => this.close();
  },

  /* ---------- pengawasan / anti-curang ---------- */
  violation(jenis, ket) {
    if (!this.started || this.ended || this.locked || this.submitting || !this.d) return;
    const now = Date.now();
    if (now - this.lastViol < 2500) return; // satu kejadian sering memicu beberapa event sekaligus
    this.lastViol = now;
    this.d.pelanggaran = (this.d.pelanggaran || 0) + 1;
    this.updateViol();
    const m = this.d.ujian.maks_pelanggaran;
    if (m && this.d.pelanggaran >= m) this.showLocked(); else this.showWarn(ket);
    api('logPelanggaran', { sesi_id: this.d.sesi_id, jenis: jenis, keterangan: ket }, { silent: true, quiet: true })
      .then(r => this.afterViol(r))
      .catch(e => { if (e.network) this.violQ.push({ jenis: jenis, ket: ket }); });
  },
  afterViol(r) {
    if (!r || !this.d) return;
    if (r.jumlah !== undefined) { this.d.pelanggaran = r.jumlah; this.updateViol(); }
    if (r.status === 'DIKUNCI' && !this.locked) this.showLocked();
  },

  on(target, ev, fn, opt) { target.addEventListener(ev, fn, opt); this.L.push([target, ev, fn, opt]); },
  removeGuards() { this.L.forEach(x => x[0].removeEventListener(x[1], x[2], x[3])); this.L = []; },

  attachGuards() {
    this.removeGuards();
    // 1) pindah tab / aplikasi / notifikasi / layar mati
    this.on(document, 'visibilitychange', () => { if (document.hidden) this.violation('TAB_HIDDEN', 'Meninggalkan halaman ujian (pindah aplikasi/tab atau layar dimatikan)'); });
    this.on(window, 'blur', () => {
      clearTimeout(this.blurT);
      this.blurT = setTimeout(() => { if (!document.hasFocus() && !document.hidden) this.violation('BLUR', 'Fokus keluar dari halaman ujian (jendela/aplikasi lain)'); }, 1500);
    });
    this.on(window, 'focus', () => clearTimeout(this.blurT));
    this.on(window, 'pagehide', () => { this.backup(); this.violation('TAB_HIDDEN', 'Halaman ujian ditutup atau dimuat ulang'); });
    // 2) fullscreen
    const fsChange = () => {
      if (this.ended || !this.started) return;
      if (this.fsEl()) return;
      if (this.fsWanted && !this.locked) {
        this.fsTrans = true; setTimeout(() => { this.fsTrans = false; }, 1500);
        this.violation('EXIT_FULLSCREEN', 'Keluar dari mode layar penuh');
        if (this.ovType() === '') this.showWarn('Keluar dari mode layar penuh');
      }
    };
    this.on(document, 'fullscreenchange', fsChange);
    this.on(document, 'webkitfullscreenchange', fsChange);
    // 3) copy / paste / klik kanan / seleksi / drag
    ['copy', 'cut', 'paste', 'contextmenu', 'dragstart', 'selectstart', 'drop'].forEach(ev => this.on(document, ev, e => {
      if (ev === 'selectstart' && e.target && e.target.closest && e.target.closest('textarea')) return;
      e.preventDefault();
      if (ev === 'copy' || ev === 'cut' || ev === 'paste') toast('Menyalin/menempel tidak diizinkan selama ujian', 'warning');
    }));
    // 4) keyboard shortcut
    this.on(document, 'keydown', e => {
      const k = (e.key || '').toLowerCase();
      const ctrl = e.ctrlKey || e.metaKey;
      const devtools = e.key === 'F12' || (ctrl && e.shiftKey && ['i', 'j', 'c', 'k'].indexOf(k) >= 0);
      if (devtools || (ctrl && ['c', 'v', 'x', 'u', 's', 'p', 'a', 'f', 'g'].indexOf(k) >= 0) || (e.altKey && k === 'tab')) {
        e.preventDefault(); e.stopPropagation();
        if (devtools) this.violation('DEVTOOLS', 'Mencoba membuka developer tools');
        else toast('Tombol pintasan dinonaktifkan selama ujian', 'warning');
      }
    }, true);
    this.on(document, 'keyup', e => {
      if (e.key === 'PrintScreen') { this.violation('COPY', 'Menekan tombol PrintScreen (tangkapan layar)'); try { navigator.clipboard.writeText(''); } catch (x) { } }
    });
    // 5) split-screen / jendela mengambang (lebar layar berubah drastis)
    this.on(window, 'orientationchange', () => { this.orientT = Date.now(); setTimeout(() => { this.baseW = window.innerWidth; }, 900); });
    this.on(window, 'resize', () => {
      if (this.fsTrans || !this.baseW || Date.now() - this.orientT < 1500) return;
      if (Math.abs(window.innerWidth - this.baseW) / this.baseW > 0.2) {
        this.baseW = window.innerWidth;
        this.violation('RESIZE', 'Ukuran layar berubah (kemungkinan split-screen / jendela mengambang)');
      }
    });
    // 6) tombol kembali & menutup halaman
    try { history.pushState({ exam: 1 }, ''); } catch (e) { }
    this.on(window, 'popstate', () => { try { history.pushState({ exam: 1 }, ''); } catch (e) { } toast('Tombol kembali dinonaktifkan selama ujian', 'warning'); });
    this.on(window, 'beforeunload', e => { if (!this.ended) { e.preventDefault(); e.returnValue = ''; } });
    // 7) koneksi kembali → kirim antrian
    this.on(window, 'online', () => this.scheduleFlush(200));
    setTimeout(() => { this.baseW = window.innerWidth; }, 1500);
  },

  fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; },
  async enterFs() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    const enabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    if (!req || !enabled) { this.fsWanted = false; return; }
    this.fsTrans = true;
    setTimeout(() => { this.fsTrans = false; this.baseW = window.innerWidth; }, 1500);
    try {
      const p = req.call(el, { navigationUI: 'hide' });
      if (p && p.then) await p;
      this.fsWanted = true;
    } catch (e) { this.fsWanted = false; }
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => { }); } catch (e) { }
  },
  exitFs() {
    try { if (this.fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) { }
  }
};
window.Exam = Exam;
</script>

/** Ekspor laporan ke file Excel (.xlsx) lengkap dengan logo & kop sekolah (dibuat langsung di browser dengan JSZip) */
const XLSX_LIB = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; // dipakai untuk MEMBACA file (import Dapodik)
const JSZIP_LIB = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
async function exportExcel(r) {
  toast('Menyiapkan file Excel…', 'info');
  await loadScript(JSZIP_LIB);
  const blob = await buatXlsx(r, LOGO.src, S.settings || {}, S.user.nama);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = r.judul.replace(/[\\/:*?"<>|]+/g, '-') + '.xlsx'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

async function buatXlsx(r, logo, st, oleh) {
  const X = s => String(s == null ? '' : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const col = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const heads = r.headers.map(h => String(h).replace(/\n/g, ' '));
  const nC = Math.max(heads.length, 3), last = col(nC - 1);
  const ada = !!logo && /^data:image\/(png|jpeg);base64,/.test(logo);
  const tc = ada ? 2 : 0; // kolom awal teks kop (kolom A–B untuk logo)
  // gaya: 0 biasa, 1 nama sekolah, 2 judul, 3 keterangan, 4 judul kolom, 5 sel tabel, 6 angka tabel
  const cell = (ref, v, s) => {
    if (v === '' || v == null) return s ? '<c r="' + ref + '" s="' + s + '"/>' : '';
    if (typeof v === 'number' && isFinite(v)) return '<c r="' + ref + '" s="' + (s === 5 ? 6 : s || 0) + '"><v>' + v + '</v></c>';
    return '<c r="' + ref + '" s="' + (s || 0) + '" t="inlineStr"><is><t xml:space="preserve">' + X(v) + '</t></is></c>';
  };
  const kop = [[st.nama_sekolah || '', 1, 24], [r.judul, 2, 20], [r.sub || '', 3, 16],
    ['Tahun Ajaran ' + (st.tahun_ajaran || '') + ' · Semester ' + (st.semester || '') + ' · Dicetak ' + new Date().toLocaleString('id-ID') + ' oleh ' + (oleh || ''), 3, 16]];
  let rows = kop.map((k, i) => '<row r="' + (i + 1) + '" ht="' + k[2] + '" customHeight="1">' + cell(col(tc) + (i + 1), k[0], k[1]) + '</row>').join('');
  rows += '<row r="5" ht="8" customHeight="1"/>';
  rows += '<row r="6">' + heads.map((h, i) => cell(col(i) + 6, h, 4)).join('') + '</row>';
  r.rows.forEach((row, ri) => { rows += '<row r="' + (7 + ri) + '">' + heads.map((_, i) => cell(col(i) + (7 + ri), row[i] == null ? '' : row[i], 5)).join('') + '</row>'; });
  const lebar = heads.map((h, i) => { const isi = Math.max(String(h).length, ...r.rows.slice(0, 300).map(x => String(x[i] == null ? '' : x[i]).length));
    return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + (i === 2 ? Math.max(28, Math.min(40, isi + 2)) : Math.max(ada && i < 2 ? 7 : 5, Math.min(32, isi + 2))) + '" customWidth="1"/>'; }).join('');
  const merges = [1, 2, 3, 4].map(i => '<mergeCell ref="' + col(tc) + i + ':' + last + i + '"/>').join('');
  const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheetViews><sheetView workbookViewId="0"><pane ySplit="6" topLeftCell="A7" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
    '<cols>' + lebar + '</cols><sheetData>' + rows + '</sheetData><mergeCells count="4">' + merges + '</mergeCells>' +
    '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="' + (nC > 10 ? 'landscape' : 'portrait') + '" fitToHeight="0"/>' +
    '<printOptions horizontalCentered="1"/>' + (ada ? '<drawing r:id="rId1"/>' : '') + '</worksheet>';
  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="5"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="14"/><name val="Arial"/></font><font><b/><sz val="12"/><name val="Arial"/></font>' +
    '<font><sz val="9"/><color rgb="FF475569"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts>' +
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1E3A8A"/><bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="4" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const z = new JSZip();
  const ext = ada ? (logo.indexOf('image/jpeg') > 0 ? 'jpeg' : 'png') : '';
  z.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
    (ada ? '<Default Extension="' + ext + '" ContentType="image/' + ext + '"/>' : '') +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    (ada ? '<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>' : '') + '</Types>');
  z.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file('xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Laporan" sheetId="1" r:id="rId1"/></sheets>' +
    '<definedNames><definedName name="_xlnm.Print_Titles" localSheetId="0">Laporan!$6:$6</definedName></definedNames></workbook>');
  z.file('xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  z.file('xl/styles.xml', styles);
  z.file('xl/worksheets/sheet1.xml', sheet);
  if (ada) {
    const E = 9525, px = 72; // logo 72×72 piksel di pojok kiri atas
    z.file('xl/worksheets/_rels/sheet1.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/></Relationships>');
    z.file('xl/drawings/_rels/drawing1.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/logo.' + ext + '"/></Relationships>');
    z.file('xl/drawings/drawing1.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<xdr:oneCellAnchor><xdr:from><xdr:col>0</xdr:col><xdr:colOff>' + 4 * E + '</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>' + 3 * E + '</xdr:rowOff></xdr:from><xdr:ext cx="' + px * E + '" cy="' + px * E + '"/>' +
      '<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="2" name="Logo"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>' +
      '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + px * E + '" cy="' + px * E + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor></xdr:wsDr>');
    z.file('xl/media/logo.' + ext, logo.split(',')[1], { base64: true });
  }
  return z.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE' });
}

/** Menampilkan laporan generik {judul, sub, headers, rows, chart} */
function renderReport(box, r, tab) {
  const isMatrix = !!r.matrix;
  box.innerHTML = '<div class="card"><div class="card-body">' + kopCetak() +
    '<div class="d-flex flex-wrap justify-content-between gap-2 mb-3"><div><h5 class="fw-bold mb-0">' + esc(r.judul) + '</h5><div class="small text-muted">' + esc(r.sub || '') + '</div></div>' +
    '<div class="d-flex flex-wrap gap-2 no-print"><button class="btn btn-sm btn-outline-success" data-act="excel"><i class="bi bi-file-earmark-excel"></i> Excel</button>' +
    '<button class="btn btn-sm btn-outline-danger" data-act="print" title="Pilih \'Simpan sebagai PDF\' pada jendela cetak"><i class="bi bi-file-earmark-pdf"></i> PDF / Cetak</button>' +
    '<button class="btn btn-sm btn-outline-secondary" data-act="csv"><i class="bi bi-filetype-csv"></i> CSV</button></div></div>' +
    (r.rows.length && r.chart && r.chart.data.some(v => v) ? '<div class="row justify-content-center mb-3"><div class="col-lg-' + (r.chart.type === 'bar' ? '10' : '5') + '"><div class="chart-box"><canvas></canvas></div></div></div>' : '') +
    (r.rows.length ? '<div class="table-responsive"><table class="table table-bordered table-sm align-middle ' + (isMatrix ? 'matrix' : '') + '"><thead class="table-light"><tr>' +
      r.headers.map(h => '<th>' + esc(h).replace(/\n/g, '<br><span class="fw-normal">') + (String(h).indexOf('\n') >= 0 ? '</span>' : '') + '</th>').join('') + '</tr></thead><tbody>' +
      r.rows.map(row => '<tr>' + row.map((c, i) => {
        const cls = isMatrix && i >= (r.cell_start || 3) && i < row.length - 6 && 'HTISA'.indexOf(c) >= 0 && c ? 'st-' + c : '';
        const isPred = tab === 'terpadu' && i === row.length - 1;
        const isBadge = r.badge_col === i && c;
        return '<td class="' + cls + (String(row[1]).indexOf('TOTAL') === 0 ? ' fw-bold table-light' : '') + '">' +
          (isPred && c !== '-' ? badge(c, { A: 'success', B: 'primary', C: 'info', D: 'warning', E: 'danger' }[c])
            : isBadge ? badge(c, { 'Tidak dibuka': 'danger', 'Digantikan': 'warning', 'Terlaksana': 'success' }[c] || 'secondary') : esc(c)) + '</td>';
      }).join('') + '</tr>').join('') + '</tbody></table></div>' : emptyState('Tidak ada data untuk filter ini')) +
    '</div></div>';
  const cv = box.querySelector('canvas');
  if (cv) {
    const c = r.chart;
    chart(cv, c.type === 'bar' ? {
      type: 'bar', data: { labels: c.labels, datasets: [{ label: c.label || '', data: c.data, backgroundColor: '#2563eb', borderRadius: 6 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
    } : {
      type: 'doughnut', data: { labels: c.labels, datasets: [{ data: c.data, backgroundColor: CHART_COLORS }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
    });
  }
}

/* ---------------- BERANDA SISWA ---------------- */
VIEWS.dashSiswa = {
  title: 'Beranda',
  render: async function (el) {
    const u = S.user;
    el.innerHTML = '<div class="card bg-brand text-white mb-3"><div class="card-body"><div class="small opacity-75">Selamat datang,</div><h5 class="fw-bold mb-0">' + esc(u.nama) + '</h5>' +
      '<div class="small opacity-75">' + esc(u.username) + ' · Kelas ' + esc(u.kelas || '-') + ' · ' + esc(S.settings.semester + ' ' + S.settings.tahun_ajaran) + '</div></div></div>' +
      '<div id="dsBody">' + spinner() + '</div>';
    await swr('beranda', 'berandaSiswa', {}, d => {
    if (!el.isConnected) return;
    resetCharts();
    const sesi = d.sesi, ujian = d.ujian, lap = d;
    const ujAktif = ujian.filter(x => x.fase === 'BERLANGSUNG' && x.sesi_status !== 'SELESAI');
    const belumAbsen = sesi.filter(x => !x.sudah);
    $('#dsBody', el).innerHTML =
      '<div class="row g-2 mb-3">' +
      statCard('calendar-check', 'Kehadiran semester', lap.ringkas.persen_hadir === null ? '-' : fmtNum(lap.ringkas.persen_hadir) + '%', 'success', 'col-6') +
      statCard('award', 'Rata-rata nilai', lap.ringkas.rata_nilai === null ? '-' : fmtNum(lap.ringkas.rata_nilai), 'primary', 'col-6') + '</div>' +
      (belumAbsen.length ? '<div class="card border-start border-4 border-warning mb-3"><div class="card-body d-flex align-items-center gap-3"><i class="bi bi-alarm fs-2 text-warning"></i>' +
        '<div class="flex-grow-1"><b>Kamu belum absen!</b><div class="small text-muted">' + belumAbsen.map(x => esc(x.mapel)).join(', ') + '</div></div>' +
        '<button class="btn btn-warning" data-go="absenSiswa">Absen</button></div></div>' : '') +
      ((d.jadwal || []).length ? '<div class="card mb-3"><div class="card-header"><i class="bi bi-calendar-week"></i> Jadwal Hari Ini</div><div class="card-body p-2"><table class="table table-sm align-middle mb-0"><tbody>' +
        d.jadwal.map(j => '<tr><td class="text-nowrap fw-semibold" style="width:100px">' + esc(j.jam_mulai + '–' + j.jam_selesai) + '</td><td>' + esc(j.mapel) +
          '<div class="small text-muted">' + esc(j.guru) + (j.ruang ? ' · ' + esc(j.ruang) : '') + '</div></td><td class="text-end">' +
          (j.status ? badge(j.status) : j.sesi ? '<button class="btn btn-sm btn-warning" data-go="absenSiswa">Absen</button>' : '') + '</td></tr>').join('') + '</tbody></table></div></div>' : '') +
      (ujAktif.length ? '<div class="card border-start border-4 border-primary mb-3"><div class="card-body"><b><i class="bi bi-pencil-square"></i> Ujian tersedia</b>' +
        ujAktif.map(x => '<div class="d-flex justify-content-between align-items-center mt-2"><div>' + esc(x.judul) + '<div class="small text-muted">' + esc(x.mapel) + ' · ' + esc(x.durasi_menit) + ' menit</div></div>' +
          '<button class="btn btn-sm btn-primary" data-go="ujianSiswa">' + (x.sesi_status ? 'Lanjutkan' : 'Kerjakan') + '</button></div>').join('') + '</div></div>' : '') +
      '<div class="card"><div class="card-header">Nilai terbaru</div><div class="card-body">' +
      (lap.nilai.length ? '<div class="chart-box" style="height:200px"><canvas id="dsChart"></canvas></div>' : emptyState('Belum ada nilai', 'award')) + '</div></div>';
    $$('[data-go]', el).forEach(b => b.onclick = () => navigate(b.dataset.go));
    if (lap.nilai.length) {
      const last = lap.nilai.slice(-8);
      chart($('#dsChart', el), {
        type: 'line', data: { labels: last.map(n => n.judul.length > 14 ? n.judul.substring(0, 14) + '…' : n.judul), datasets: [{ data: last.map(n => n.skor), borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.15)', fill: true, tension: .3 }] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
      });
    }
    });
  }
};
