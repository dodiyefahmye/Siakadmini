<script>
'use strict';
/* =============================================================
 * App.html — inti sisi klien: state, pemanggil API, UI helper,

const S = { token: null, user: null, settings: {}, view: null, params: {}, master: null, timers: [], cleanups: [], charts: [] };
const VIEWS = {};
const HOME = { admin: 'dashAdmin', guru: 'dashGuru', siswa: 'dashSiswa' };
const ROLE_LABEL = { admin: 'Administrator', guru: 'Guru', siswa: 'Siswa' };
const JENIS_LABEL = { KUIS_BULANAN: 'Kuis Bulanan', UTS: 'UTS', UAS: 'UAS' };
const MENUS = {
  admin: [['dashAdmin', 'speedometer2', 'Dashboard'], ['users', 'people', 'Pengguna'], ['master', 'diagram-3', 'Kelas & Mapel'], ['jadwal', 'calendar-week', 'Jadwal Pelajaran'],
    ['absenHarian', 'calendar-day', 'Absen Harian'], ['absensiGuru', 'qr-code', 'Absen Mapel'], ['bankSoal', 'journal-text', 'Bank Soal'], ['ujianGuru', 'pencil-square', 'Ujian / CBT'],
    ['laporan', 'bar-chart-line', 'Laporan'], ['auditLog', 'clock-history', 'Log Aktivitas'], ['pengaturan', 'gear', 'Pengaturan']],
  guru: [['dashGuru', 'speedometer2', 'Dashboard'], ['absenHarian', 'calendar-day', 'Absen Harian'], ['absensiGuru', 'qr-code', 'Absen Mapel'], ['jadwal', 'calendar-week', 'Jadwal Saya'], ['bankSoal', 'journal-text', 'Bank Soal'],
    ['ujianGuru', 'pencil-square', 'Ujian / CBT'], ['laporan', 'bar-chart-line', 'Laporan']],
  siswa: [['dashSiswa', 'house', 'Beranda'], ['absenSiswa', 'qr-code-scan', 'Absen'], ['ujianSiswa', 'pencil-square', 'Ujian'],
    ['laporanSiswa', 'bar-chart-line', 'Nilai'], ['wajah', 'person-bounding-box', 'Wajah']]
};

  Hadir: 'success', Terlambat: 'warning', Izin: 'info', Sakit: 'primary', Alpha: 'danger', Belum: 'light',
  AKTIF: 'success', SELESAI: 'secondary', NONAKTIF: 'secondary', BERAKHIR: 'dark', BERLANGSUNG: 'primary',
  DIKUNCI: 'danger', BELUM: 'light', RESET: 'secondary', BELUM_MULAI: 'info', TERDAFTAR: 'success'
};

/* ---------------- util ---------------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('siakad_' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('siakad_' + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem('siakad_' + k); } catch (e) { } }
};
/* ---------------- LOGO SEKOLAH ----------------
 * Logo disimpan di database; klien hanya mengunduhnya ulang bila versinya berubah. */
const LOGO = {
  src: (store.get('logo') || {}).src || '',
  set(src) {
    this.src = src || '';
    document.querySelectorAll('.logo-slot').forEach(e => { e.innerHTML = this.inner(e.dataset.icon); });
    ['icon', 'apple-touch-icon'].forEach(rel => {
      let l = document.querySelector('link[rel="' + rel + '"]');
      if (!this.src) { if (l) l.remove(); return; }
      if (!l) { l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); }
      l.href = this.src;
    });
  },
  inner(icon) { return this.src ? '<img src="' + this.src + '" alt="Logo">' : '<i class="bi bi-' + (icon || 'mortarboard-fill') + '"></i>'; },
  html(cls, icon) { return '<span class="logo-slot ' + (cls || '') + '" data-icon="' + (icon || 'mortarboard-fill') + '">' + this.inner(icon) + '</span>'; },
  async sync(ver) {
    if (!ver) { store.del('logo'); return this.set(''); }
    const c = store.get('logo');
    if (c && c.ver === ver) { if (c.src !== this.src) this.set(c.src); return; }
    try { const r = await api('logo', {}, { silent: true, quiet: true }); store.set('logo', { ver: r.ver, src: r.logo }); this.set(r.logo); } catch (e) { }
  }
};
function judulHalaman(nama) { document.title = (nama ? nama + ' – ' : '') + 'SIAKAD Mini'; }

const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
function fmtDT(s, withTime) {

/* ---------------- API ----------------
 * api('namaAksi', data, { silent, quiet })
 *  silent = tanpa loading bar; quiet = tanpa toast error
 */
/**
 * Transport ke server Supabase:
 *   POST {SUPABASE_URL}/rest/v1/rpc/api  body {p_token, p_action, p_data}
 *   Header "apikey" = publishable key (sb_publishable_...) — aman dipasang di kode publik,
 *   karena seluruh tabel terkunci dan hanya fungsi api() yang bisa dipanggil.
 * (google.script.run tetap didukung bila halaman dijalankan di Apps Script / alat uji.)
 */
function supabaseReady() {
  return !!(window.SUPABASE_URL && window.SUPABASE_KEY && !/GANTI|xxxx/i.test(window.SUPABASE_URL + window.SUPABASE_KEY));
}
function callServer(req) {
  if (supabaseReady()) {
    const key = window.SUPABASE_KEY;
    const headers = { 'Content-Type': 'application/json', 'apikey': key };
    if (/^eyJ/.test(key)) headers.Authorization = 'Bearer ' + key; // kunci "anon" lama (format JWT)
    return fetch(window.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/api', {
      method: 'POST', headers: headers, cache: 'no-store',
      body: JSON.stringify({ p_token: req.token || null, p_action: req.action, p_data: req.data || {} })
    }).then(async r => {
      const t = await r.text();
      let j = null;
      try { j = JSON.parse(t); } catch (e) { }
      if (!r.ok) {
        if (r.status >= 500) throw new Error('Server database tidak merespons (HTTP ' + r.status + '). Jika proyek Supabase dijeda, aktifkan kembali di dashboard Supabase.');
        if (r.status === 404) throw new Error('Fungsi api tidak ditemukan. Pastikan setup.sql sudah dijalankan di Supabase.');
        if (r.status === 401 || r.status === 403) throw new Error('Kunci API Supabase ditolak. Periksa SUPABASE_KEY di index.html.');
        throw new Error((j && (j.message || j.hint)) || ('HTTP ' + r.status));
      }
      if (!j) throw new Error('Respons server tidak valid');
      return j;
    });
  }
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(req));
  }
  return Promise.reject(new Error('SUPABASE_URL dan SUPABASE_KEY belum diisi di index.html'));
}

function api(action, data, opt) {
  opt = opt || {};
  if (!opt.silent) loading(true);
  const done = () => { if (!opt.silent) loading(false); };
  return callServer({ token: S.token, action: action, data: data || {} }).then(r => {
    done();
    if (r && r.ok) return r.data;
    const err = new Error((r && r.error) || 'Terjadi kesalahan');
    err.code = r && r.code;
    if (err.code === 'AUTH' && action !== 'me') { doLogout(true, err.message); }
    else if (err.code === 'GANTI_PW') { if (S.user) S.user.wajib_ganti_pw = true; forcePassword(); }
    else if (!opt.quiet) toast(err.message, 'danger');
    throw err;
  }, e => {
    done();
    const err = new Error('Gagal terhubung ke server: ' + (e && e.message ? e.message : e));
    err.network = true;
    if (!opt.quiet) toast(err.message, 'danger');
    throw err;
  });
}

/**
 * Tampil-cepat (stale-while-revalidate): data terakhir yang tersimpan di HP langsung ditampilkan,
 * lalu diperbarui diam-diam dari server. Halaman terasa instan walau server butuh 1–3 detik.
 * render(data, dariCache) bisa dipanggil dua kali.
 */
async function swr(key, action, data, render) {
  const k = 'swr_' + (S.user ? S.user.id : '') + '_' + key;
  const cached = store.get(k);
  if (cached) { try { render(cached, true); } catch (e) { console.error(e); } }
  try {
    const fresh = await api(action, data, { silent: !!cached, quiet: !!cached });
    store.set(k, fresh);
    render(fresh, false);
    return fresh;
  } catch (e) {
    if (cached) { toast('Mode offline: menampilkan data terakhir', 'warning'); return cached; }
    throw e;
  }
}
function clearSwr() {
  try { Object.keys(localStorage).filter(k => k.indexOf('siakad_swr_') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) { }

    '<input class="form-control" name="username" required autocomplete="username" autocapitalize="none"></div></div>' +
    '<div class="mb-3"><label class="form-label small fw-semibold">Password</label><div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>' +
    '<input class="form-control" type="password" name="password" required autocomplete="current-password">' +
    '<button class="btn btn-outline-secondary" type="button" id="togglePw"><i class="bi bi-eye"></i></button></div></div>' +
    '<button class="btn btn-primary w-100 py-2 fw-semibold" id="btnLogin"><i class="bi bi-box-arrow-in-right"></i> Masuk</button>' +
    '</form><div class="text-center text-muted small mt-4" id="lgSem"></div></div></div></div>';
  const form = $('#loginForm');
  $('#togglePw').onclick = () => { const i = form.password; i.type = i.type === 'password' ? 'text' : 'password'; };
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = $('#btnLogin');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Memeriksa…';
    try {
      const r = await api('login', { username: form.username.value, password: form.password.value });
      S.token = r.token; S.user = r.user; S.settings = r.settings;
      store.set('auth', { token: r.token });
      if (S.user.wajib_ganti_pw) return forcePassword();
      startApp();
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Masuk';
    }
  };
  api('publicInfo', {}, { silent: true, quiet: true }).then(i => {
    const n = $('#lgSchool'); if (n) n.textContent = i.nama_sekolah;
    judulHalaman(i.nama_sekolah); LOGO.sync(i.logo_ver);
    const s = $('#lgSem'); if (s) s.textContent = 'Tahun Ajaran ' + i.tahun_ajaran + ' · Semester ' + i.semester;
  }).catch(() => { });
}

async function doLogout(kicked, msg) {
  if (!kicked && S.token) { try { await api('logout', {}, { quiet: true }); } catch (e) { } }
  if (window.Exam) Exam.forceClose();
  leaveView();
  clearSwr();
  store.del('auth');
  S.token = null; S.user = null; S.master = null;
  renderLogin(kicked ? msg : '');
}

function passwordDlg() {
  formModal({
    title: 'Ganti Password',
    fields: [
      { name: 'password_lama', label: 'Password lama', type: 'password', required: true, autocomplete: 'current-password' },
      { name: 'password_baru', label: 'Password baru (min. 6 karakter)', type: 'password', required: true, autocomplete: 'new-password' },
      { name: 'konfirmasi', label: 'Ulangi password baru', type: 'password', required: true, autocomplete: 'new-password' }
    ],
    onSubmit: async d => { await api('changePassword', d); toast('Password berhasil diganti', 'success'); }
  });
}

/** Layar wajib ganti password (login pertama / password direset admin) */
function forcePassword() {
  leaveView();
  document.body.classList.remove('has-bottom-nav');
  $('#app').innerHTML =
    '<div class="login-wrap"><div class="card login-card"><div class="card-body p-4">' +
    '<div class="login-logo"><i class="bi bi-shield-lock"></i></div>' +
    '<h5 class="text-center fw-bold mb-1">Buat Password Baru</h5>' +
    '<p class="text-center text-muted small mb-3">Halo <b>' + esc(S.user ? S.user.nama : '') + '</b>, demi keamanan akun Anda wajib mengganti password awal sebelum memakai aplikasi.</p>' +
    '<form id="fpForm" autocomplete="off">' +
    fieldHtml({ name: 'password_lama', label: 'Password saat ini', type: 'password', required: true, autocomplete: 'current-password' }) +
    fieldHtml({ name: 'password_baru', label: 'Password baru (min. 6 karakter, bukan NIS)', type: 'password', required: true, autocomplete: 'new-password' }) +
    fieldHtml({ name: 'konfirmasi', label: 'Ulangi password baru', type: 'password', required: true, autocomplete: 'new-password' }) +
    '<button class="btn btn-primary w-100 py-2 mt-2" id="fpBtn"><i class="bi bi-check2-circle"></i> Simpan & Lanjutkan</button>' +
    '<button type="button" class="btn btn-link w-100 mt-1 text-muted" id="fpOut">Keluar</button></form></div></div></div>';
  $('#fpOut').onclick = () => doLogout(false);
  $('#fpForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#fpBtn'); btn.disabled = true;
    try {
      await api('changePassword', readForm(e.target));
      S.user.wajib_ganti_pw = false;
      toast('Password berhasil diganti', 'success');
      startApp();
    } catch (err) { btn.disabled = false; }
  };
}

function startApp() {
  judulHalaman(S.settings && S.settings.nama_sekolah); LOGO.sync(S.settings && S.settings.logo_ver);
  renderShell();
  getMaster().catch(() => { });
  navigate(HOME[S.user.role]);
}

async function boot() {
  const saved = store.get('auth');
  if (saved && saved.token) {
    S.token = saved.token;
    try {
      const me = await api('me', {}, { quiet: true });
      S.user = me.user; S.settings = me.settings;
      if (S.user.wajib_ganti_pw) return forcePassword();
      return startApp();
    } catch (e) {
      if (e.network) return offlineScreen(e.message);
      S.token = null;
      store.del('auth');
      return renderLogin(e.code === 'AUTH' ? e.message : '');
    }
  }
  renderLogin();
}

/** Server tidak terjangkau saat aplikasi dibuka: sesi login tetap disimpan, cukup coba lagi */
function offlineScreen(msg) {
  document.body.classList.remove('has-bottom-nav');
  $('#app').innerHTML = '<div class="login-wrap"><div class="card login-card"><div class="card-body p-4 text-center">' +
    '<div class="login-logo"><i class="bi bi-wifi-off"></i></div><h5 class="fw-bold">Tidak dapat terhubung</h5>' +
    '<p class="small text-muted">Periksa koneksi internet lalu coba lagi. Anda tidak perlu login ulang.</p>' +
    '<div class="small text-danger mb-3">' + esc(msg || '') + '</div>' +
    '<button class="btn btn-primary w-100" id="olRetry"><i class="bi bi-arrow-clockwise"></i> Coba lagi</button>' +
    '<button class="btn btn-link w-100 text-muted mt-1" id="olOut">Masuk dengan akun lain</button></div></div></div>';
  $('#olRetry').onclick = () => boot();
  $('#olOut').onclick = () => { S.token = null; store.del('auth'); renderLogin(); };
}
</script>

<script>
/* =============================================================
 * ViewsAdmin.html — Dashboard admin, Pengguna, Kelas & Mapel, Pengaturan

VIEWS.dashAdmin = {

  render: async function (el) {
    el.innerHTML = pageHead('Dashboard Admin', 'Ringkasan aktivitas sekolah hari ini') + '<div id="dz">' + spinner() + '</div>';

    if (!el.isConnected) return;
    resetCharts();

      statCard('diagram-3', 'Kelas', d.kelas, 'secondary') + statCard('journal-text', 'Soal di bank', d.soal, 'warning') +
      statCard('qr-code', 'Sesi absen aktif', d.sesi_aktif, 'success') + statCard('pencil-square', 'Ujian berlangsung', d.ujian_aktif, 'danger') +
      '</div><div class="row g-3"><div class="col-lg-8"><div class="card h-100"><div class="card-header">Tren Kehadiran 7 Hari Terakhir</div><div class="card-body"><div class="chart-box"><canvas id="cTren"></canvas></div></div></div></div>' +
      '<div class="col-lg-4"><div class="card h-100"><div class="card-header">Status Absensi Hari Ini</div><div class="card-body">' +
      (totalHari ? '<div class="chart-box"><canvas id="cHari"></canvas></div>' : emptyState('Belum ada absensi hari ini', 'calendar-x')) + '</div></div></div></div>' +
      '<div class="card mt-3"><div class="card-body d-flex flex-wrap gap-2">' +
      '<button class="btn btn-outline-primary" data-go="users"><i class="bi bi-person-plus"></i> Tambah pengguna</button>' +
      '<button class="btn btn-outline-primary" data-go="absensiGuru"><i class="bi bi-qr-code"></i> Buka sesi absensi</button>' +
      '<button class="btn btn-outline-primary" data-go="ujianGuru"><i class="bi bi-pencil-square"></i> Kelola ujian</button>' +
      '<button class="btn btn-outline-primary" data-go="laporan"><i class="bi bi-bar-chart"></i> Laporan</button></div></div>';
    $$('[data-go]', el).forEach(b => b.onclick = () => navigate(b.dataset.go));
    chart($('#cTren', el), {
      type: 'bar',
      data: {
        labels: d.tren.map(t => fmtDT(t.tanggal, false).replace(/ \d{4}$/, '')),
        datasets: [{ label: 'Hadir/Terlambat', data: d.tren.map(t => t.hadir), backgroundColor: '#22c55e', borderRadius: 6 },
          { label: 'Izin/Sakit/Alpha', data: d.tren.map(t => t.tidak), backgroundColor: '#f87171', borderRadius: 6 }]
      },
      options: { maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } }
    });
    if (totalHari) chart($('#cHari', el), {
      type: 'doughnut',
      data: { labels: Object.keys(h), datasets: [{ data: Object.values(h), backgroundColor: ['#22c55e', '#facc15', '#38bdf8', '#a78bfa', '#ef4444'] }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });
    });
  }
};

/* ---------------- PENGGUNA ---------------- */
VIEWS.users = {
  title: 'Pengguna',
  render: async function (el) {
    await getMaster(true);
    let role = 'siswa', rows = [], q = '', kelas = '';
    const SUP = !!S.user.super_admin;
    // akun admin hanya boleh dikelola Super Admin; admin biasa tetap boleh mengubah akunnya sendiri
    const bolehKelola = u => u.role !== 'admin' || SUP || u.id === S.user.id;
    el.innerHTML = pageHead('Manajemen Pengguna', 'Akun siswa, guru, dan admin. Password awal akun baru = username.',
      '<button class="btn btn-outline-success btn-sm" data-act="cetakKartu"><i class="bi bi-printer"></i> Cetak Kartu</button>' +
      '<button class="btn btn-outline-success btn-sm" data-act="fotoMassal"><i class="bi bi-images"></i> Unggah Foto</button>' +
      '<button class="btn btn-outline-success btn-sm" data-act="dapodik"><i class="bi bi-file-earmark-excel"></i> Import Dapodik</button>' +
      '<button class="btn btn-outline-primary btn-sm" data-act="import"><i class="bi bi-clipboard"></i> Tempel</button>' +
      '<button class="btn btn-primary btn-sm" data-act="add"><i class="bi bi-plus-lg"></i> Tambah</button>') +
      '<div class="card"><div class="card-body">' +
      '<ul class="nav nav-pills mb-3" id="roleTabs">' + ['siswa', 'guru', 'admin'].map(r =>
        '<li class="nav-item"><a href="#" class="nav-link' + (r === role ? ' active' : '') + '" data-act="role" data-id="' + r + '">' + ROLE_LABEL[r] + '</a></li>').join('') + '</ul>' +
      '<div class="row g-2 mb-3"><div class="col-md-5"><input class="form-control" id="uq" placeholder="Cari nama / username…"></div>' +
      '<div class="col-md-4" id="ukWrap"><select class="form-select" id="uk">' + optionsHtml(kelasOpts(), '', 'Semua kelas') + '</select></div>' +
      '<div class="col-md-3 text-md-end small text-muted align-self-center" id="ucount"></div></div>' +
      '<div id="uInfoAdmin" class="alert alert-info small py-2" style="display:none"><i class="bi bi-shield-lock"></i> ' +
        (SUP ? 'Anda <b>Super Admin</b>: hanya Super Admin yang dapat menambah, mengubah, atau menghapus akun admin. Centang <b>Super Admin</b> di form untuk memberi hak yang sama.'
             : 'Akun admin hanya dapat dikelola oleh <b>Super Admin</b>. Anda tetap dapat mengubah akun Anda sendiri.') + '</div>' +
      '<div id="utable">' + spinner() + '</div></div></div>';

    async function refreshKelas() {
      await getMaster(true);
      $('#uk', el).innerHTML = optionsHtml(kelasOpts(), kelas, 'Semua kelas');
      load();
    }
    async function load() { $('#utable', el).innerHTML = spinner(); rows = await api('listUsers', { role }, { silent: true }); draw(); }
    function draw() {
      const list = rows.filter(u => (!q || (u.nama + ' ' + u.username).toLowerCase().includes(q)) && (!kelas || u.kelas_id === kelas));
      $('#ucount', el).textContent = list.length + ' pengguna';
      const cols = [
        { h: 'Username', f: u => '<code>' + esc(u.username) + '</code>' },
        { h: 'Nama', f: u => esc(u.nama) + (u.super_admin ? ' <span class="badge text-bg-danger" title="Boleh mengelola akun admin">Super Admin</span>' : '') + (u.piket ? ' <span class="badge text-bg-warning" title="Petugas piket absen harian">Piket</span>' : '') },
        { h: 'L/P', cls: 'text-center', f: u => jkBadge(u.jk) },
      ];
      if (role === 'siswa') {
        cols.push({ h: 'Kelas', f: u => esc(u.kelas || '-') });
        cols.push({ h: 'Foto', cls: 'text-center', f: u => u.foto ? '<i class="bi bi-person-square text-success" title="Sudah ada pas foto"></i>' : '<span class="text-muted small" title="Kartu memakai foto pengganti">–</span>' });
        cols.push({ h: 'Wajah', f: u => u.face === 'TERDAFTAR' ? badge('Terdaftar', 'success') : u.face === 'RESET' ? badge('Boleh daftar ulang', 'warning') : badge('Belum', 'light') });
      }
      cols.push({ h: 'Status', f: u => badge(u.status) });
      cols.push({ h: '', cls: 'text-end text-nowrap', f: u =>
        (role === 'siswa' ? actBtn('kartu', u.id, 'person-badge', 'Kartu QR (cetak / ganti jika hilang)', 'outline-success') + ' ' : '') +
        (role === 'siswa' && u.face === 'TERDAFTAR' ? actBtn('face', u.id, 'person-bounding-box', 'Izinkan daftar ulang wajah') + ' ' : '') +
        (role === 'siswa' && u.face !== 'BELUM' ? actBtn('delFace', u.id, 'person-x', 'Hapus data wajah', 'outline-warning') + ' ' : '') +
        (bolehKelola(u) ? actBtn('edit', u.id, 'pencil', 'Ubah') + (u.id === S.user.id ? '' : ' ' + actBtn('del', u.id, 'trash', 'Hapus', 'outline-danger'))
          : '<span class="small text-muted" title="Hanya Super Admin yang dapat mengelola akun admin"><i class="bi bi-lock"></i> Super Admin</span>') });
      $('#utable', el).innerHTML = tableHtml(cols, list, { empty: 'Belum ada pengguna' });
    }
    async function userForm(u) {
      u = u || { role: role, status: 'AKTIF' };
      await getMaster(); // daftar kelas terbaru (mis. setelah import membuat kelas baru)
      if (u.id) {
        const p = await api('getProfil', { user_id: u.id });
        ['jenis_kelamin', 'nisn', 'nip', 'tempat_lahir', 'tanggal_lahir', 'alamat', 'no_telepon', 'nama_wali', 'telepon_wali', 'foto'].forEach(k => u[k] = p[k]);
      }
      const fotoBox = u.id && u.role === 'siswa' ? '<div class="d-flex align-items-center gap-3 mb-3 p-2 border rounded bg-light">' +
        '<img id="ufFoto" src="' + esc(fotoSrc(u.foto, u.jenis_kelamin)) + '" alt="" class="rounded border bg-white" style="width:72px;height:96px;object-fit:cover">' +
        '<div><div class="small fw-semibold mb-1">Pas foto (kartu pelajar)</div><div class="small text-muted mb-2" id="ufFotoKet">' + (u.foto ? 'Sudah ada foto.' : 'Belum ada — kartu memakai foto pengganti.') + '</div>' +
        '<label class="btn btn-sm btn-primary mb-0"><i class="bi bi-upload"></i> Pilih foto…<input type="file" accept="image/*" hidden id="ufFotoFile"></label> ' +
        '<button type="button" class="btn btn-sm btn-outline-danger" id="ufFotoDel"' + (u.foto ? '' : ' disabled') + '><i class="bi bi-trash"></i> Hapus</button></div></div>' : '';
      formModal({ size: 'lg',
        title: u.id ? 'Ubah Pengguna' : 'Tambah Pengguna',
        intro: fotoBox,
        values: u,
        fields: [
          { name: 'id', type: 'hidden' },
          { name: 'username', label: 'Username (NIS untuk siswa / NIP untuk guru)', required: true, col: 'col-md-6' },
          { name: 'nama', label: 'Nama lengkap', required: true, col: 'col-md-6' },
          { name: 'role', label: 'Role', type: 'select', placeholder: false, col: 'col-md-6',
            options: [['siswa', 'Siswa'], ['guru', 'Guru']].concat(SUP || u.role === 'admin' ? [['admin', 'Admin']] : []),
            disabled: u.id === S.user.id, help: u.id === S.user.id ? 'Role akun sendiri tidak bisa diubah' : '' },
          { name: 'kelas_id', label: 'Kelas', type: 'select', options: kelasOpts(), col: 'col-md-6' },
          { name: 'password', label: 'Password', type: 'password', help: u.id ? 'Kosongkan jika tidak diubah' : 'Kosongkan = sama dengan username', col: 'col-md-6', autocomplete: 'new-password' },
          { name: 'status', label: 'Status', type: 'select', options: [['AKTIF', 'Aktif'], ['NONAKTIF', 'Nonaktif']], placeholder: false, col: 'col-md-6' },
          { name: 'piket', label: 'Petugas piket — boleh membuka & memindai absen harian semua kelas', type: 'checkbox' }
        ].concat(SUP ? [{ name: 'super_admin', label: 'Super Admin — boleh menambah, mengubah, dan menghapus akun admin', type: 'checkbox',
            disabled: u.id === S.user.id && u.super_admin, help: u.id === S.user.id && u.super_admin ? 'Status Super Admin akun sendiri hanya bisa dicabut oleh Super Admin lain' : '' }] : [])
        .concat(biodataFields()),
        onRender: form => {
          const t = () => { showField(form, 'kelas_id', form.role.value === 'siswa'); showField(form, 'piket', form.role.value === 'guru');
            if (form.super_admin) showField(form, 'super_admin', form.role.value === 'admin'); toggleBiodata(form, form.role.value); };
          form.role.onchange = t; t();
          const fi = $('#ufFotoFile');
          if (fi) {
            const setFoto = async src => {
              await api('saveFoto', { user_id: u.id, foto: src });
              $('#ufFoto').src = fotoSrc(src, form.jenis_kelamin ? form.jenis_kelamin.value : u.jenis_kelamin);
              $('#ufFotoKet').textContent = src ? 'Foto tersimpan.' : 'Foto dihapus — kartu memakai foto pengganti.';
              $('#ufFotoDel').disabled = !src;
              const row = rows.find(x => x.id === u.id); if (row) { row.foto = !!src; draw(); }
            };
            fi.onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return;
              try { await setFoto(await fotoDariFile(f)); toast('Foto disimpan', 'success'); } catch (err) { if (!err.code) toast(err.message, 'danger'); } };
            $('#ufFotoDel').onclick = async () => { try { await setFoto(''); } catch (err) { } };
          }
        },
        onSubmit: async d => { delete d._bio;
          if (u.id === S.user.id) { d.role = u.role; if (u.super_admin) d.super_admin = true; }
          await api('saveUser', d);
          if (u.id === S.user.id) { const me = await api('me', {}); S.user = Object.assign(S.user, me.user); } toast('Data pengguna disimpan', 'success'); S.master = null; load(); }
      });
    }
    function importDlg() {
      const el2 = modal({
        title: 'Import Pengguna dari Spreadsheet', size: 'lg',
        body: '<p class="small mb-2">Salin baris dari Google Sheets/Excel lalu tempel di bawah. Urutan kolom:</p>' +
          '<div class="table-responsive"><table class="table table-sm table-bordered small mb-2"><tr class="table-light"><th>username</th><th>nama</th><th>role</th><th>kelas</th><th>password (opsional)</th></tr>' +
          '<tr><td>1001</td><td>Ahmad Fauzi</td><td>siswa</td><td>X-IPA-1</td><td></td></tr><tr><td>198501012010</td><td>Budi Santoso</td><td>guru</td><td></td><td>rahasia1</td></tr></table></div>' +
          '<p class="small text-muted">Kelas yang belum ada akan dibuat otomatis. Baris judul boleh ikut ditempel.</p>' +
          '<textarea id="impText" class="form-control font-monospace small" rows="8" placeholder="Tempel di sini…"></textarea><div id="impRes" class="mt-2"></div>',
        footer: '<button class="btn btn-light" data-bs-dismiss="modal">Tutup</button><button class="btn btn-primary" id="impGo"><i class="bi bi-upload"></i> Import</button>'
      });
      $('#impGo', el2).onclick = async () => {
        let lines = parseTSV($('#impText', el2).value);
        if (lines.length && lines[0][0].toLowerCase() === 'username') lines = lines.slice(1);
        if (!lines.length) return toast('Data kosong', 'warning');
        const btn = $('#impGo', el2); btn.disabled = true;
        try {
          const r = await api('importUsers', { rows: lines.map(c => ({ username: c[0], nama: c[1], role: c[2] || 'siswa', kelas: c[3], password: c[4] })) });
          $('#impRes', el2).innerHTML = '<div class="alert alert-success small py-2">Berhasil menambah ' + r.added + ' pengguna' + (r.kelas_baru ? ' dan ' + r.kelas_baru + ' kelas baru' : '') + '.</div>' +
            (r.errors.length ? '<div class="alert alert-warning small py-2" style="max-height:160px;overflow:auto">' + r.errors.map(esc).join('<br>') + '</div>' : '');
          await refreshKelas();
        } finally { btn.disabled = false; }
      };
    }

    bindActs(el, {
      role: r => {
        role = r;
        $$('#roleTabs .nav-link', el).forEach(a => a.classList.toggle('active', a.dataset.id === r));
        $('#ukWrap', el).style.display = r === 'siswa' ? '' : 'none';
        $('#uInfoAdmin', el).style.display = r === 'admin' ? '' : 'none';
        load();
      },
      add: () => { if (role === 'admin' && !SUP) return toast('Hanya Super Admin yang dapat menambah akun admin', 'warning'); userForm(); },
      edit: id => userForm(Object.assign({}, rows.find(x => x.id === id))),
      del: async id => {
        const u = rows.find(x => x.id === id);
        if (!await confirmDlg('Hapus pengguna <b>' + esc(u.nama) + '</b>? Data absensi & nilainya tetap tersimpan tetapi tidak lagi muncul di laporan.', 'Hapus', 'danger')) return;

/** Unggah banyak pas foto sekaligus: nama file = NIS atau NISN (mis. 1001.jpg) */
function fotoMassalDlg(onDone) {
  const el = modal({
    title: 'Unggah Pas Foto Siswa', size: 'lg',
    body: '<ol class="small mb-3 ps-3"><li>Beri nama setiap file foto dengan <b>NIS</b> atau <b>NISN</b> siswa, mis. <code>1001.jpg</code> atau <code>0091234567.png</code>.</li>' +
      '<li>Pilih banyak file sekaligus (bisa satu kelas). Foto otomatis dipotong rasio 3×4 dan diperkecil.</li>' +
      '<li>Foto lama siswa yang sama akan diganti. Siswa tanpa foto memakai foto pengganti di kartu.</li></ol>' +
      '<input type="file" class="form-control mb-2" id="fmFile" accept="image/*" multiple>' +
      '<div class="progress mb-2 d-none" id="fmProg" style="height:8px"><div class="progress-bar bg-success" style="width:0"></div></div><div id="fmRes" class="small"></div>',
    footer: '<button class="btn btn-light" data-bs-dismiss="modal">Tutup</button><button class="btn btn-primary" id="fmGo" disabled><i class="bi bi-upload"></i> Unggah</button>'
  });
  const inp = $('#fmFile', el), go = $('#fmGo', el), res = $('#fmRes', el), bar = $('#fmProg', el);
  inp.onchange = () => { go.disabled = !inp.files.length; res.textContent = inp.files.length ? inp.files.length + ' file dipilih' : ''; };
  go.onclick = async () => {
    const files = Array.from(inp.files); if (!files.length) return;
    go.disabled = true; inp.disabled = true; bar.classList.remove('d-none');
    const ok = [], gagal = []; let batch = [], selesai = 0;
    const kirim = async () => {
      if (!batch.length) return;
      try { const r = await api('importFoto', { items: batch }, { silent: true }); ok.push(...r.berhasil); gagal.push(...r.gagal); }
      catch (e) { batch.forEach(b => gagal.push({ kunci: b.kunci, alasan: e.message })); }
      batch = [];
    };
    for (const f of files) {
      const kunci = f.name.replace(/\.[^.]+$/, '').trim();
      try { batch.push({ kunci, foto: await fotoDariFile(f) }); } catch (e) { gagal.push({ kunci: f.name, alasan: e.message }); }
      if (batch.length >= 10) await kirim();
      selesai++; bar.firstChild.style.width = (selesai / files.length * 100) + '%';
      res.textContent = 'Memproses ' + selesai + ' / ' + files.length + '…';
    }
    await kirim();
    res.innerHTML = '<div class="alert alert-success py-2 mb-2">' + ok.length + ' foto tersimpan.</div>' +
      (gagal.length ? '<div class="alert alert-warning py-2" style="max-height:180px;overflow:auto"><b>' + gagal.length + ' tidak tersimpan:</b><br>' +
        gagal.map(g => esc(g.kunci) + ' — ' + esc(g.alasan)).join('<br>') + '</div>' : '');
    inp.disabled = false; inp.value = ''; bar.classList.add('d-none');
    if (onDone) onDone();
  };
}

/** Memperkecil gambar logo (maks 256 px, PNG; JPEG bila hasilnya terlalu besar) */
function kecilkanLogo(file) {
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onerror = () => no(new Error('File tidak dapat dibaca'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => no(new Error('File bukan gambar yang valid'));
      im.onload = () => {
        const k = Math.min(1, 256 / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        let d = c.toDataURL('image/png');
        if (d.length > 300000) d = c.toDataURL('image/jpeg', 0.9);
        ok(d);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/** Foto pengganti (siluet) untuk siswa yang belum punya pas foto */
function fotoDummy(jk) {
  const bg = jk === 'P' ? '#fce7f3' : jk === 'L' ? '#dbeafe' : '#e2e8f0', fg = jk === 'P' ? '#f9a8d4' : jk === 'L' ? '#93c5fd' : '#94a3b8';

  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function fotoSrc(foto, jk) { return foto || fotoDummy(jk); }

/** Pas foto dari file: dipotong di tengah ke rasio 3×4, diperkecil 300×400, JPEG ±25–40 KB */
function fotoDariFile(file) {
  return new Promise((ok, no) => {
    if (!/^image\//.test(file.type)) return no(new Error(file.name + ': bukan file gambar'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error(file.name + ': gambar tidak dapat dibaca')); };
    im.onload = () => {
      URL.revokeObjectURL(url);
      const W = 300, H = 400, r = W / H;
      let sw = im.width, sh = im.height, sx = 0, sy = 0;
      if (sw / sh > r) { sw = sh * r; sx = (im.width - sw) / 2; } else { sh = sw / r; sy = Math.max(0, (im.height - sh) * 0.3); } // potret: sisakan bagian kepala
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
      g.drawImage(im, sx, sy, sw, sh, 0, 0, W, H);
      let d = c.toDataURL('image/jpeg', 0.85);
      if (d.length > 280000) d = c.toDataURL('image/jpeg', 0.6);
      ok(d);
    };
    im.src = url;
  });
}

/* =============================================================
 *  IMPORT DARI FILE DAPODIK (Excel .xlsx/.xls atau .csv)
 * ============================================================= */
const DAPODIK_KOLOM = {
  nama: ['namalengkap', 'nama', 'namasiswa', 'namapesertadidik', 'namapd'],
  nisn: ['nisn'],
  nis: ['nis', 'nipd', 'nisnipd'],
  tempat_lahir: ['tempatlahir'],
  tanggal_lahir: ['tanggallahir', 'tgllahir', 'tgllhr'],
  kelas: ['tingkatrombel', 'rombel', 'rombelsaatini', 'namarombel', 'kelas', 'tingkatkelas'],
  status: ['status', 'statussiswa'],
  jenis_kelamin: ['jeniskelamin', 'jk', 'lp', 'kelamin'],
  alamat: ['alamat', 'alamatjalan', 'alamatlengkap'],
  no_telepon: ['notelepon', 'telepon', 'nohp', 'hp', 'nomortelepon', 'notelp', 'nohpsiswa', 'nomorhp'],
  nama_wali: ['namawali', 'namaayah', 'namaibu', 'namaortu', 'namaorangtua'],
  telepon_wali: ['nohportu', 'hportu', 'teleponwali', 'nohpwali', 'hpwali', 'nohporangtua', 'teleponortu']
};
const normKolom = h => String(h == null ? '' : h).toLowerCase().replace(/[^a-z0-9]/g, '');
const bersihSel = v => (v == null ? '' : String(v)).replace(/^'+/, '').replace(/\s+/g, ' ').trim();

/** Nama kelas dari kolom rombel: "Kelas 8 - kelas VIII" → "VIII" */
function kelasDariRombel(v) {
  let s = bersihSel(v);
  if (!s) return '';
  if (s.indexOf('-') >= 0) s = s.split('-').pop();
  return s.replace(/^\s*kelas\s+/i, '').trim();
}
function tanggalSel(v) {
  if (v instanceof Date && !isNaN(v)) {
    return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  }
  if (typeof v === 'number' && v > 1000 && v < 80000) { // nomor seri tanggal Excel
    const d = new Date(Math.round((v - 25569) * 86400000));
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  }
  return bersihSel(v);
}

/** aoa (array baris) → data siap impor. Baris judul dicari otomatis (boleh ada judul laporan di atasnya). */
function parseDapodik(aoa) {
  let hi = -1, map = {};
  for (let i = 0; i < Math.min(aoa.length, 20); i++) {
    const m = {};
    (aoa[i] || []).forEach((h, j) => {
      const n = normKolom(h);
      Object.keys(DAPODIK_KOLOM).forEach(k => {
        const idx = DAPODIK_KOLOM[k].indexOf(n);
        if (idx >= 0 && (m[k] === undefined || idx < m[k].p)) m[k] = { j: j, p: idx };
      });
    });
    if (m.nama && (m.nisn || m.nis)) { hi = i; Object.keys(m).forEach(k => map[k] = m[k].j); break; }
  }
  if (hi < 0) throw new Error('Kolom "Nama" dan "NISN"/"NIS" tidak ditemukan. Pastikan file berisi baris judul kolom seperti hasil ekspor Dapodik.');
  const rows = [], warn = [];
  for (let i = hi + 1; i < aoa.length; i++) {
    const r = aoa[i] || [];
    const g = k => map[k] === undefined ? '' : r[map[k]];
    const nama = bersihSel(g('nama'));
    let nisn = bersihSel(g('nisn')), nis = bersihSel(g('nis'));
    if (!nama && !nisn && !nis) continue;
    if (/^\d+(\.0+)?$/.test(nisn)) { nisn = nisn.replace(/\.0+$/, ''); if (nisn.length < 10) nisn = nisn.padStart(10, '0'); } // NISN 10 digit
    const username = nisn || nis;
    const jk0 = bersihSel(g('jenis_kelamin')).toUpperCase().charAt(0);
    const st = bersihSel(g('status')).toLowerCase();
    if (!username || !nama) { warn.push('Baris ' + (i + 1) + ': nama/NISN kosong (dilewati)'); continue; }
    rows.push({
      username: username, nama: nama, role: 'siswa', kelas: kelasDariRombel(g('kelas')), kelas_asli: bersihSel(g('kelas')),
      nisn: nisn, jenis_kelamin: jk0 === 'L' || jk0 === 'P' ? jk0 : '',
      tempat_lahir: bersihSel(g('tempat_lahir')), tanggal_lahir: tanggalSel(g('tanggal_lahir')),
      status: !st ? '' : /^aktif/.test(st) ? 'AKTIF' : 'NONAKTIF',   // kosong = status lama dipertahankan
      alamat: bersihSel(g('alamat')), no_telepon: bersihSel(g('no_telepon')),
      nama_wali: bersihSel(g('nama_wali')), telepon_wali: bersihSel(g('telepon_wali'))
    });
  }
  // hanya kirim kolom biodata yang memang ada di file (agar data lama tidak terhapus)
  const ada = Object.keys(map);
  rows.forEach(r => ['tempat_lahir', 'tanggal_lahir', 'alamat', 'no_telepon', 'nama_wali', 'telepon_wali', 'jenis_kelamin'].forEach(k => { if (ada.indexOf(k) < 0) delete r[k]; }));
  return { rows: rows, warn: warn, kolom: ada, abaikan: (aoa[hi] || []).filter(h => normKolom(h) === 'nik').length ? ['NIK'] : [] };
}

function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ((first.match(/\t/g) || []).length ? '\t' : ',');
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  return out;
}

async function bacaFileTabel(file, angkaMentah) {
  if (/\.(csv|txt)$/i.test(file.name)) return parseCsv(await file.text());
  await loadScript(XLSX_LIB);
  // angkaMentah: jam/tanggal dibaca sebagai angka Excel (tepat), bukan objek Date tahun 1899 yang bisa bergeser beberapa menit
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: !angkaMentah });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
}

/** Dialog import Dapodik: pilih file → pratinjau + pemetaan kelas → impor (diperbarui bila sudah ada) */

        (data.abaikan.length ? '<span class="text-muted">Kolom diabaikan: ' + data.abaikan.join(', ') + '</span>' : '') + '</div>' +

    const rows = data.rows.map(r => { const o = Object.assign({}, r, { kelas: peta[r.kelas] || r.kelas }); delete o.kelas_asli; return o; });

    try {
      for (let i = 0; i < rows.length; i += 300) { // dikirim bertahap agar aman untuk file besar
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> ' + Math.min(i + 300, rows.length) + '/' + rows.length;
        const r = await api('importUsers', { perbarui: $('#dpUpd', el).checked, rows: rows.slice(i, i + 300) });
        tot.added += r.added; tot.updated += r.updated; tot.kelas_baru += r.kelas_baru;
        tot.errors = tot.errors.concat(r.errors.map(e => e.replace(/^Baris (\d+)/, (m, n) => 'Baris ' + (+n + i))));
      }
      $('#dpRes', el).innerHTML = '<div class="alert alert-success small py-2">Selesai: <b>' + tot.added + '</b> siswa baru, <b>' + tot.updated + '</b> diperbarui' +
        (tot.kelas_baru ? ', ' + tot.kelas_baru + ' kelas baru' : '') + '. Siswa baru login dengan password = NISN dan wajib menggantinya.</div>' +
        (tot.errors.length ? '<div class="alert alert-warning small py-2" style="max-height:160px;overflow:auto">' + tot.errors.map(esc).join('<br>') + '</div>' : '');
      S.master = null;
      if (onDone) onDone();
    } finally { btn.disabled = false; btn.innerHTML = '<i class="bi bi-upload"></i> Import'; }
  };
}
</script>

<script>
/* =============================================================
 * ViewsAbsensi.html — Absensi QR dinamis & Face Recognition
 * Guru : daftar sesi, buka sesi, layar QR, detail sesi, mode kiosk wajah
 * Siswa: daftar sesi aktif, scan QR, absen wajah, registrasi wajah
 * ============================================================= */

const QR_LIB = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
const FACE_LIB = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js';
const FACE_MODEL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';

function camErr(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'Izin kamera ditolak. Izinkan akses kamera untuk situs ini di pengaturan browser, lalu muat ulang.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'Kamera tidak ditemukan di perangkat ini.';
  if (n === 'NotReadableError') return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi tersebut lalu coba lagi.';
  return 'Kamera tidak dapat diakses (' + (e && e.message ? e.message : e) + '). Buka aplikasi melalui Chrome/Safari, bukan dari dalam aplikasi lain.';
}

/* ---------------- Pengenalan wajah (face-api.js) ---------------- */
const Face = {
  ready: false, stream: null, _p: null,
  /** Memuat pustaka + model sekali saja; panggilan berikutnya menunggu proses yang sama */
  async load(msgFn) {
    if (this.ready) return;
    if (!this._p) {
      this._p = (async () => {
        await loadScript(FACE_LIB);
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL),
          faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL),
          faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL)
        ]);
        await this.warmup();
        this.ready = true;
      })();
    }
    msgFn && msgFn('Menyiapkan pengenalan wajah (pertama kali ±6 MB)…');
    try { await this._p; } catch (e) { this._p = null; throw e; }
  },
  /**
   * Pemanasan: inferensi pertama di GPU HP butuh 1–3 detik untuk kompilasi.
   * Dilakukan di belakang layar agar deteksi pertama di depan siswa langsung cepat.
   */
  async warmup() {
    try {
      const c = document.createElement('canvas');
      c.width = c.height = 160;
      const g = c.getContext('2d'); g.fillStyle = '#999'; g.fillRect(0, 0, 160, 160);
      await faceapi.detectSingleFace(c, this.fastOpts()).withFaceLandmarks();
      await faceapi.computeFaceDescriptor(c);
    } catch (e) { /* abaikan */ }
  },
  /** Muat model di latar belakang (dipanggil saat siswa membuka menu Absen/Wajah) */
  preload() { if (!this.ready && !this._p) setTimeout(() => this.load().catch(() => { }), 800); },
  async start(video, facing) {
    this.stop();
    const nav = S.nav;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Browser tidak mendukung akses kamera. Gunakan Chrome/Safari versi terbaru.');
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing || 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    } catch (e) { throw new Error(camErr(e)); }
    if (S.nav !== nav) { this.stop(); throw new Error('dibatalkan'); } // halaman sudah ditinggalkan
    video.setAttribute('playsinline', ''); video.muted = true;
    video.srcObject = this.stream;
    onLeave(() => this.stop());
    await video.play();
  },
  stop() { if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; } },
  opts() { return new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }); },
  fastOpts() { return new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.45 }); },
  /** Deteksi lengkap + descriptor (berat) — dipakai SEKALI setelah kedip berhasil */
  async detect(video) { return faceapi.detectSingleFace(video, this.opts()).withFaceLandmarks().withFaceDescriptor(); },
  /** Deteksi ringan (tanpa descriptor) — dipakai berulang untuk memantau kedipan */
  async detectFast(video) { return faceapi.detectSingleFace(video, this.fastOpts()).withFaceLandmarks(); },
  /** Ambil descriptor final, coba beberapa kali bila wajah sempat hilang */
  async finalDescriptor(video) {
    for (let i = 0; i < 6; i++) {
      const d = await this.detect(video);
      if (d) return d;
      await sleep(80);
    }
    throw new Error('Wajah hilang dari bingkai. Tahan posisi sebentar setelah berkedip.');
  },
  async countFaces(video) { return (await faceapi.detectAllFaces(video, this.opts())).length; },
  ear(p) { const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y); return (d(p[1], p[5]) + d(p[2], p[4])) / (2 * d(p[0], p[3])); },
  /**
   * Liveness sederhana: siswa diminta BERKEDIP. Foto/layar HP tidak bisa berkedip.
   * Menggunakan Eye Aspect Ratio (EAR) dari landmark mata, ambang adaptif per orang.
   * Resolve dengan hasil deteksi (mata terbuka) setelah kedipan terdeteksi.
   */
  liveness(video, msg, isActive, timeoutMs) {
    const t0 = Date.now();
    let maxEar = 0, frames = 0, closed = false;
    return new Promise((resolve, reject) => {
      const step = async () => {
        if (isActive && !isActive()) return reject(new Error('dibatalkan'));
        if (Date.now() - t0 > (timeoutMs || 25000)) return reject(new Error('Waktu habis. Pastikan wajah terlihat jelas lalu berkedip perlahan.'));
        let det = null;
        try { det = await this.detectFast(video); } catch (e) { }
        if (!det) { msg('Arahkan wajah ke dalam bingkai…', 'warn'); return setTimeout(step, 100); }
        frames++;
        const lm = det.landmarks;
        const ear = (this.ear(lm.getLeftEye()) + this.ear(lm.getRightEye())) / 2;
        if (!closed) {
          if (ear > maxEar) maxEar = ear;
          msg('Wajah terdeteksi — silakan BERKEDIP perlahan', 'info');
          if (frames > 3 && maxEar > 0.18 && ear < maxEar * 0.72) closed = true;
        } else if (ear > maxEar * 0.85) {
          msg('Kedipan terdeteksi ✓ — memproses wajah…', 'ok');
          return this.finalDescriptor(video).then(resolve, reject);
        }
        setTimeout(step, 0);
      };
      step();
    });
  }
};

function camBox(id) {
  return '<div class="cam-wrap"><video id="' + id + '" autoplay muted playsinline></video><div class="face-guide"></div><div class="cam-msg" id="' + id + 'Msg">Menyiapkan kamera…</div></div>';
}
function setCamMsg(el, text, type) { if (!el) return; el.textContent = text; el.className = 'cam-msg' + (type ? ' ' + type : ''); }

/* ---------------- Pemindai QR (html5-qrcode) ---------------- */
/* Pemindai QR + pengaturan kamera (depan/belakang & cermin), pilihan diingat per perangkat */
const QRS = {
  inst: null, busy: false, elId: null, onCode: null, cams: null, camIdx: -1,
  pref: (() => { try { return JSON.parse(localStorage.getItem('qrsPref') || '{}'); } catch (e) { return {}; } })(),
  simpan() { try { localStorage.setItem('qrsPref', JSON.stringify(this.pref)); } catch (e) { } },
  sentuh: () => matchMedia('(pointer:coarse)').matches,
  facing() { return this.pref.facing || 'environment'; },
  // Default cermin: aktif untuk kamera depan & webcam laptop (yang memang menghadap pengguna)
  cermin() { return typeof this.pref.mirror === 'boolean' ? this.pref.mirror : (this.pref.deviceId ? !this.sentuh() : (this.facing() === 'user' || !this.sentuh())); },
  async start(elId, onCode) {
    const nav = S.nav;
    await loadScript(QR_LIB);
    await this.stop();
    if (S.nav !== nav || !document.getElementById(elId)) return; // halaman sudah ditinggalkan
    this.elId = elId; this.onCode = onCode;
    // Hanya format QR + pakai BarcodeDetector bawaan browser bila tersedia (jauh lebih cepat)
    this.inst = new Html5Qrcode(elId, {
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    this.busy = false;
    onLeave(() => this.stop());
    const cfg = { fps: 15, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } };
    const cb = txt => { if (this.busy) return; this.busy = true; onCode(txt); };
    const kam = this.pref.deviceId || { facingMode: this.facing() };
    const inst = this.inst;
    try { await inst.start(kam, cfg, cb, () => { }); }
    catch (e) {
      if (S.nav !== nav) return; // halaman sudah ditinggalkan: abaikan galat kamera
      if (this.pref.deviceId) { // kamera tersimpan sudah tidak ada → kembali ke mode depan/belakang
        delete this.pref.deviceId; this.simpan();
        try { await inst.start({ facingMode: this.facing() }, cfg, cb, () => { }); } catch (e2) { throw new Error(camErr(e2)); }
      } else throw new Error(camErr(e));
    }
    if (S.nav !== nav || this.inst !== inst) { // halaman sudah ditinggalkan saat kamera sedang dinyalakan
      try { if (inst.isScanning) await inst.stop(); inst.clear(); } catch (e) { }
      if (this.inst === inst) this.inst = null;
      return;
    }
    this.terapkanCermin(); this.panel();
  },
  terapkanCermin() {
    const v = document.querySelector('#' + this.elId + ' video');
    if (v) v.style.transform = this.cermin() ? 'scaleX(-1)' : 'none';
  },
  panel() {
    const box = document.getElementById(this.elId); if (!box) return;
    let c = document.getElementById(this.elId + 'Ctl');
    if (!c) { c = document.createElement('div'); c.id = this.elId + 'Ctl'; c.className = 'qrs-ctl d-flex justify-content-center gap-2 flex-wrap mt-2'; box.after(c); }
    const depan = (this.pref.deviceId || !this.sentuh()) ? null : this.facing() === 'user';
    c.innerHTML = '<button type="button" class="btn btn-outline-secondary btn-sm" data-qrs="flip"><i class="bi bi-arrow-repeat"></i> ' +
      (depan === null ? 'Ganti kamera' : 'Kamera: ' + (depan ? 'Depan' : 'Belakang')) + '</button>' +
      '<button type="button" class="btn btn-sm ' + (this.cermin() ? 'btn-secondary' : 'btn-outline-secondary') + '" data-qrs="mirror"><i class="bi bi-symmetry-vertical"></i> Cermin: ' + (this.cermin() ? 'Aktif' : 'Mati') + '</button>';
    c.querySelector('[data-qrs=flip]').onclick = () => this.gantiKamera();
    c.querySelector('[data-qrs=mirror]').onclick = () => { this.pref.mirror = !this.cermin(); this.simpan(); this.terapkanCermin(); this.panel(); };
  },
  async gantiKamera() {
    if (!this.elId) return;
    try { if (!this.cams) this.cams = await Html5Qrcode.getCameras(); } catch (e) { this.cams = []; }
    if (this.cams.length === 1) return toast('Perangkat ini hanya punya satu kamera', 'info');
    const berlabel = this.cams.some(c => /back|rear|belakang|environment|front|depan|user|facing/i.test(c.label || ''));
    if (this.sentuh() || berlabel || !this.cams.length) {
      // HP/tablet: tukar kamera depan ↔ belakang
      this.pref.facing = this.facing() === 'user' ? 'environment' : 'user'; delete this.pref.deviceId;
      toast(this.pref.facing === 'user' ? 'Kamera depan' : 'Kamera belakang', 'info');
    } else {
      // Laptop/PC dengan beberapa webcam: pindah ke kamera berikutnya
      const now = this.cams.findIndex(c => c.id === this.pref.deviceId);
      const ix = now < 0 ? 1 : (now + 1) % this.cams.length; // kamera bawaan biasanya urutan pertama
      const nx = this.cams[ix];
      this.pref.deviceId = nx.id; toast(nx.label || 'Kamera ' + (ix + 1), 'info');
    }
    delete this.pref.mirror; // cermin kembali ke default kamera baru; masih bisa diubah
    this.simpan();
    try { await this.start(this.elId, this.onCode); } catch (e) { toast(e.message, 'danger'); }
  },
  async stop() {
    const i = this.inst; this.inst = null;
    if (this.elId) { const c = document.getElementById(this.elId + 'Ctl'); if (c) c.remove(); }
    try { if (i && i.isScanning) await i.stop(); if (i) i.clear(); } catch (e) { }
  },
  async scanFile(file) {
    await loadScript(QR_LIB);
    let d = document.getElementById('qrFileTmp');
    if (!d) { d = document.createElement('div'); d.id = 'qrFileTmp'; d.style.display = 'none'; document.body.appendChild(d); }
    const h = new Html5Qrcode('qrFileTmp', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
    try { return await h.scanFile(file, false); } finally { try { h.clear(); } catch (e) { } }
  }
};

}

VIEWS.qrDisplay = {

  render: async function (el, p) {

      '<button class="btn btn-success btn-sm d-none" data-act="kartu" id="qrKartuBtn"><i class="bi bi-upc-scan"></i> Scan Kartu</button>' +

      '<div class="card qr-card" id="qrCard"><div class="card-body text-center py-4">' +
      '<h3 class="fw-bold mb-1" id="qrTitle">Memuat…</h3><div class="text-muted mb-3" id="qrSub"></div>' +
      '<div class="qr-box mx-auto" id="qrBox"></div>' +
      '<div class="progress mt-3 mx-auto" style="height:6px;max-width:320px"><div class="progress-bar" id="qrBar" style="transition:width .25s linear"></div></div>' +
      '<div class="small text-muted mt-1">QR berganti otomatis dalam <b id="qrSec">-</b> detik · screenshot tidak berlaku</div>' +
      '<div class="display-5 fw-bold mt-3"><span id="qrHadir">0</span><span class="text-muted fs-3"> / <span id="qrTotal">0</span></span></div><div class="text-muted">siswa sudah absen</div>' +
      '</div></div>';
    let qr = null, nextAt = 0, iv = 20000;
    const box = $('#qrBox', el);
    async function tick() {
      try {
        const r = await api('getQr', { id: p.id }, { silent: true, quiet: true });
        if (!qr) qr = new QRCode(box, { text: r.payload, width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M });
        else { qr.clear(); qr.makeCode(r.payload); }
        $('#qrTitle', el).textContent = r.kelas + ' · ' + r.mapel;
        $('#qrSub', el).textContent = 'Sesi ' + r.jam + ' · Buka aplikasi di HP → menu Absen → Scan QR';
        $('#qrHadir', el).textContent = r.hadir; $('#qrTotal', el).textContent = r.total;
        $('#qrKartuBtn', el).classList.toggle('d-none', !metodeBoleh(r.metode, 'KARTU'));
        iv = r.interval; nextAt = Date.now() + r.sisa;
        later(tick, r.sisa + 300);
      } catch (e) {
        if (/ditutup|tidak ditemukan/i.test(e.message)) {
          box.innerHTML = '<div class="alert alert-secondary mb-0">' + esc(e.message) + '</div>';
          $('#qrSec', el).textContent = '-';
          return;
        }
        later(tick, 3000);
      }
    }
    every(() => {
      const s = Math.max(0, nextAt - Date.now());
      $('#qrSec', el).textContent = Math.ceil(s / 1000);
      $('#qrBar', el).style.width = (s / iv * 100) + '%';
    }, 250);
    bindActs(el, {
      back: () => navigate(p.dari || 'absensiGuru'),
      detail: () => navigate('detailSesi', { id: p.id, dari: p.dari }),
      kartu: () => navigate('scanKartu', { id: p.id, dari: p.dari }),
      fs: () => { const c = $('#qrCard', el); (c.requestFullscreen || c.webkitRequestFullscreen || function () { toast('Layar penuh tidak didukung', 'warning'); }).call(c); },
      close: async () => {
        if (!await confirmDlg('Tutup sesi ini? Siswa yang belum absen otomatis <b>Alpha</b>.', 'Tutup Sesi', 'danger')) return;
        await api('closeSesi', { id: p.id }); toast('Sesi ditutup', 'success'); navigate('detailSesi', { id: p.id });
      }
    });
    tick();
  }
};

VIEWS.wajah = {
  title: 'Registrasi Wajah',

    el.innerHTML = pageHead('Registrasi Wajah', 'Dilakukan sekali untuk absensi dengan wajah') + spinner();
    const st = await api('faceStatus', {}, { silent: true });
    if (st.terdaftar && !st.boleh_ulang) {
      el.innerHTML = pageHead('Registrasi Wajah', 'Dilakukan sekali untuk absensi dengan wajah') +
        resultCard(true, 'Wajah Sudah Terdaftar', ['Terdaftar pada ' + fmtDT(st.updated_at), 'Untuk mendaftar ulang (mis. penampilan berubah), minta admin membuka izin registrasi ulang.']);
      return;
    }
    el.innerHTML = pageHead('Registrasi Wajah', st.terdaftar ? 'Admin mengizinkan registrasi ulang' : 'Dilakukan sekali untuk absensi dengan wajah') +
      '<div id="rArea"><div class="card mb-3"><div class="card-body small"><ol class="mb-0 ps-3"><li>Cari tempat yang terang, wajah menghadap cahaya.</li><li>Lepas masker, topi, dan kacamata hitam.</li>' +
      '<li>Hanya wajahmu yang boleh terlihat di kamera.</li><li>Berkedip saat diminta, lalu diam sebentar selama sampel diambil.</li></ol></div></div>' +
      '<button class="btn btn-primary w-100 py-2" data-act="start"><i class="bi bi-camera"></i> Mulai Registrasi</button></div>';
    let active = true;
    onLeave(() => { active = false; });
    Face.preload();
    bindActs(el, {
      again: () => navigate('wajah'), home: () => navigate('dashSiswa'),
      start: async () => {
        $('#rArea', el).innerHTML = camBox('rv') + '<div class="progress mt-3 mx-auto" style="max-width:420px;height:8px"><div class="progress-bar bg-success" id="rBar" style="width:0"></div></div>';
        const video = $('#rv', el), msg = $('#rvMsg', el);
        try {
          await Promise.all([Face.load(t => setCamMsg(msg, t)), Face.start(video, 'user')]);
          const first = await Face.liveness(video, (t, c) => setCamMsg(msg, t, c), () => active);
          const samples = [Array.from(first.descriptor)];
          let tries = 0;
          while (samples.length < 5 && active && tries < 60) {
            tries++;
            await sleep(200);
            if (tries % 4 === 1 && (await Face.countFaces(video)) > 1) { setCamMsg(msg, 'Terdeteksi lebih dari satu wajah!', 'err'); continue; }
            const d = await Face.detect(video);
            if (d && d.detection.score > 0.6) {
              samples.push(Array.from(d.descriptor));
              setCamMsg(msg, 'Mengambil sampel ' + samples.length + '/5 — tahan posisi…', 'info');
              $('#rBar', el).style.width = (samples.length / 5 * 100) + '%';

          }
          if (!active) return;
          if (samples.length < 3) throw new Error('Sampel wajah kurang. Pastikan pencahayaan cukup lalu ulangi.');
          setCamMsg(msg, 'Menyimpan data wajah…', 'info');
          await api('registerFace', { descriptors: samples }, { quiet: true });
          Face.stop();
          $('#rArea', el).innerHTML = resultCard(true, 'Registrasi Berhasil', ['Sekarang kamu bisa absen menggunakan wajah.'], '<button class="btn btn-primary" data-act="home">Selesai</button>');

        }
      }
    });
  }
};

<script>
/* =============================================================
 * ViewsKartu.html — Kartu QR siswa (ukuran ID card) & Mode Scan Kartu
 * ============================================================= */

const METODE_LABEL = {
  QR: 'QR (HP siswa)', FACE: 'Wajah', KEDUANYA: 'QR atau Wajah',
  KARTU: 'Kartu QR', QR_KARTU: 'QR HP atau Kartu', SEMUA: 'QR, Wajah, atau Kartu'
};
const METODE_OPSI = [['QR_KARTU', 'QR dari HP atau Kartu QR (disarankan)'], ['QR', 'QR dinamis dari HP saja'], ['KARTU', 'Kartu QR saja (dipindai guru)'],
  ['FACE', 'Wajah (face recognition)'], ['KEDUANYA', 'QR dari HP atau Wajah'], ['SEMUA', 'Semua: QR HP, Wajah, atau Kartu']];
function metodeBoleh(m, jenis) {
  return { QR: ['QR', 'KEDUANYA', 'QR_KARTU', 'SEMUA'], FACE: ['FACE', 'KEDUANYA', 'SEMUA'], KARTU: ['KARTU', 'QR_KARTU', 'SEMUA'] }[jenis].indexOf(m) >= 0;
}

/* ---------------- CETAK KARTU (85,6 × 54 mm, 10 per A4) ---------------- */
function cetakKartu(data) {
  if (!data.kartu.length) return toast('Tidak ada siswa untuk dicetak', 'warning');
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.innerHTML = '<div class="kartu-sheet">' + data.kartu.map((c, i) =>
    '<div class="kartu">' +
    '<div class="k-head">' + LOGO.html() + '<div class="k-head-t"><div class="k-sek">' + esc(data.sekolah || '') + '</div><div class="k-jud">KARTU PELAJAR</div></div></div>' +
    '<div class="k-body"><img class="k-foto" src="' + esc(fotoSrc(c.foto, c.jk)) + '" alt="">' +

/* ---------------- BUNYI ---------------- */
let _audio = null;
function bip(ok) {
  try {
    _audio = _audio || new (window.AudioContext || window.webkitAudioContext)();
    const tones = ok ? [[1046, 0, 0.12]] : [[330, 0, 0.15], [262, 0.18, 0.2]];
    tones.forEach(t => {
      const o = _audio.createOscillator(), g = _audio.createGain();
      o.frequency.value = t[0]; o.type = 'sine'; g.gain.value = 0.15;
      o.connect(g); g.connect(_audio.destination);
      o.start(_audio.currentTime + t[1]); o.stop(_audio.currentTime + t[1] + t[2]);
    });
  } catch (e) { }
  try { if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]); } catch (e) { }
}

VIEWS.scanKartu = {
  title: 'Scan Kartu',
  render: async function (el, p) {
    el.innerHTML = spinner();
    const gerbang = !!p.gerbang; // scan gerbang: kartu menentukan kelas → dicatat ke absen harian kelasnya
    const d = gerbang ? { sesi: { kelas: 'Semua kelas', mapel: 'Absen Harian', jam_mulai: '', jam_selesai: '' }, siswa: [] } : await api('detailSesi', { id: p.id }, { silent: true });
    let hadir = d.siswa.filter(x => ['Hadir', 'Terlambat', 'Izin', 'Sakit'].indexOf(x.status) >= 0).length, total = d.siswa.length;
    el.innerHTML = '<div class="d-flex flex-wrap justify-content-between gap-2 mb-3 no-print"><button class="btn btn-light btn-sm" data-act="back"><i class="bi bi-arrow-left"></i> Kembali</button>' +
      '<div class="d-flex gap-2"><button class="btn btn-outline-primary btn-sm" data-act="cam"><i class="bi bi-camera"></i> <span id="skCamLbl">Pakai kamera</span></button>' +
      '<button class="btn btn-outline-secondary btn-sm" data-act="detail"><i class="bi bi-list-check"></i> Daftar hadir</button></div></div>' +
      (gerbang ? '<div class="text-center mb-3"><h4 class="fw-bold mb-0"><i class="bi bi-door-open"></i> Scan Kartu Gerbang · Absen Harian</h4>' +
        '<div class="text-muted small">Semua kelas: siswa otomatis tercatat di absen harian kelasnya masing-masing</div>' +
        '<div class="display-6 fw-bold mt-2"><span id="skHadir">0</span><span class="text-muted fs-4"> tercatat di layar ini</span></div></div>'
      : '<div class="text-center mb-3"><h4 class="fw-bold mb-0">Scan Kartu: ' + esc(d.sesi.kelas + ' · ' + d.sesi.mapel) + '</h4>' +
      '<div class="text-muted small">Siswa maju satu per satu dan menunjukkan kartunya · ' + esc(d.sesi.jam_mulai + '–' + d.sesi.jam_selesai) + '</div>' +
      '<div class="display-6 fw-bold mt-2"><span id="skHadir">' + hadir + '</span><span class="text-muted fs-4"> / ' + total + ' tercatat</span></div></div>') +
      '<div class="row justify-content-center g-3"><div class="col-lg-6">' +
      '<div id="skFlash" class="card mb-3"><div class="card-body text-center py-4 text-muted"><i class="bi bi-upc-scan fs-1 d-block mb-2"></i>Menunggu kartu…</div></div>' +
      '<div id="skReader" class="mb-3" style="max-width:420px;margin:auto"></div>' +
      '<div class="input-group input-group-lg mb-1"><span class="input-group-text"><i class="bi bi-upc"></i></span>' +
      '<input id="skInput" class="form-control" placeholder="Scanner USB / ketik kode kartu lalu Enter" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>' +
      '<div class="form-text mb-3">Scanner barcode USB bekerja seperti keyboard: cukup arahkan ke QR kartu saat kotak ini aktif.</div>' +
      '<div class="card"><div class="card-header small">Baru dipindai</div><div class="card-body p-2" id="skLog"><div class="small text-muted p-2">Belum ada</div></div></div>' +
      '</div></div>';
    const input = $('#skInput', el);
    let lastCode = '', lastAt = 0, busy = false, camOn = false; const antre = [];
    const presisi = window.matchMedia && matchMedia('(pointer:fine)').matches; // laptop/PC: kotak input selalu fokus untuk scanner USB
    if (presisi) input.focus();
    const flash = (jenis, judul, sub, foto) => {
      const warna = { ok: 'success', sudah: 'primary', err: 'danger' }[jenis];
      const ikon = { ok: 'check-circle-fill', sudah: 'info-circle-fill', err: 'x-circle-fill' }[jenis];
      $('#skFlash', el).outerHTML = '<div id="skFlash" class="card mb-3 border-0 text-bg-' + warna + '"><div class="card-body py-3 d-flex align-items-center justify-content-center gap-3">' +
        (foto !== undefined ? '<img src="' + esc(foto) + '" alt="" class="rounded bg-white" style="width:96px;height:128px;object-fit:cover;border:3px solid #fff">' : '') +
        '<div class="text-center"><i class="bi bi-' + ikon + '" style="font-size:2.6rem"></i><div class="fs-3 fw-bold mt-1">' + esc(judul) + '</div><div class="fs-6">' + esc(sub || '') + '</div>' +
        (foto !== undefined ? '<div class="small opacity-75 mt-1">Cocokkan foto dengan wajah siswa</div>' : '') + '</div></div></div>';
    };
    const log = html => {
      const l = $('#skLog', el); if (l.querySelector('.text-muted.p-2')) l.innerHTML = '';
      l.insertAdjacentHTML('afterbegin', '<div class="small border-bottom py-1 px-2">' + html + ' <span class="text-muted float-end">' + new Date().toLocaleTimeString('id-ID') + '</span></div>');
    };
    async function proses(kode) {
      kode = String(kode || '').trim();
      if (!kode) return;
      if (kode === lastCode && Date.now() - lastAt < 4000) return; // kartu yang sama tertahan di depan kamera
      lastCode = kode; lastAt = Date.now();
      if (busy) { if (antre.indexOf(kode) < 0) antre.push(kode); return; } // dipindai beruntun: proses bergiliran
      busy = true;
      try {
        const r = gerbang ? await api('scanKartuHarian', { kode: kode }, { silent: true, quiet: true })
                          : await api('scanKartu', { sesi_id: p.id, kode: kode }, { silent: true, quiet: true });
        const kls = gerbang && r.kelas ? r.kelas + ' · ' : '';
        if (r.sudah) { flash('sudah', r.nama, kls + 'Sudah tercatat ' + r.status + ' pukul ' + r.waktu.substring(11, 16), fotoSrc(r.foto)); bip(true); log('<i class="bi bi-info-circle text-primary"></i> ' + esc(r.nama) + ' (sudah)'); }
        else {
          flash('ok', r.nama, kls + r.status + ' · ' + r.waktu.substring(11, 16), fotoSrc(r.foto)); bip(true);
          hadir = gerbang ? hadir + 1 : r.hadir; $('#skHadir', el).textContent = hadir;
          log('<i class="bi bi-check-circle text-success"></i> <b>' + esc(r.nama) + '</b>' + (gerbang ? ' (' + esc(r.kelas) + ')' : '') + ' — ' + esc(r.status));
        }
      } catch (e) {
        flash('err', 'Ditolak', e.message); bip(false);
        log('<i class="bi bi-x-circle text-danger"></i> ' + esc(e.message));
      } finally {
        busy = false; QRS.busy = false;
        if (antre.length && el.isConnected) { const n = antre.shift(); lastCode = ''; proses(n); }
      }
    }
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const v = input.value; input.value = ''; proses(v); } });
    if (presisi) input.addEventListener('blur', () => later(() => { if (el.isConnected && !$('.modal.show') && !camOn) input.focus(); }, 300));
    bindActs(el, {
      back: () => navigate(gerbang ? 'absenHarian' : (p.dari || 'absensiGuru')),
      detail: () => gerbang ? navigate('absenHarian') : navigate('detailSesi', { id: p.id, dari: p.dari }),
      cam: async () => {
        if (camOn) { await QRS.stop(); camOn = false; $('#skCamLbl', el).textContent = 'Pakai kamera'; $('#skReader', el).innerHTML = ''; return; }
        try {
          $('#skCamLbl', el).textContent = 'Matikan kamera'; camOn = true;
          await QRS.start('skReader', kode => { setTimeout(() => { QRS.busy = false; }, 1200); proses(kode); });
        } catch (e) { camOn = false; $('#skCamLbl', el).textContent = 'Pakai kamera'; toast(e.message, 'danger'); }
      }
    });
  }
};
</script>

<script>
/* =============================================================
 * ViewsHarian.html — Absen Harian (sekali sehari per kelas)
 *  - Admin & guru piket: semua kelas, "Buka semua", scan kartu gerbang, hari libur (admin)
 *  - Wali kelas: kelas perwaliannya, termasuk mengatur mode absensi kelas
 * ============================================================= */

const MODE_LABEL = { HARIAN: 'Absen harian', MAPEL: 'Per mapel', KEDUANYA: 'Harian + per mapel' };
const MODE_OPSI = [['MAPEL', 'Per mata pelajaran (tiap jam pelajaran)'], ['HARIAN', 'Absen harian (sekali sehari, saat masuk)'], ['KEDUANYA', 'Keduanya (harian + per mapel)']];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

function tglPanjang(iso) {
  const d = new Date(iso + 'T00:00:00');
  return HARI[d.getDay()] + ', ' + fmtDT(iso, false);
}

VIEWS.absenHarian = {
  title: 'Absen Harian',
  render: async function (el) {
    el.innerHTML = pageHead('Absen Harian', 'Memuat…') + spinner();
    let d = null;
    async function load(diam) {
      d = await api('harianHariIni', {}, { silent: true, quiet: !!diam });
      draw();
    }
    function aksi(k) {
      const x = k.sesi;
      if (k.mode === 'MAPEL') return '<span class="small text-muted">Memakai absen per mapel</span>';
      if (!x) return d.libur ? '' : actBtn('buka', k.id, 'play-circle', 'Buka absen harian', 'primary');
      let h = '';
      if (x.status === 'AKTIF') {
        if (metodeBoleh(x.metode, 'QR')) h += actBtn('qr', x.id, 'qr-code', 'Tampilkan QR', 'outline-primary') + ' ';
        if (metodeBoleh(x.metode, 'KARTU')) h += actBtn('kartu', x.id, 'upc-scan', 'Scan kartu', 'outline-success') + ' ';
        if (metodeBoleh(x.metode, 'FACE')) h += actBtn('kiosk', x.id, 'person-bounding-box', 'Kiosk wajah', 'outline-primary') + ' ';
      }
      h += actBtn('detail', x.id, 'list-check', 'Daftar hadir') + ' ';
      if (x.status === 'AKTIF' || x.status === 'BERAKHIR') h += actBtn('tutup', x.id, 'stop-circle', 'Tutup sekarang (yang belum absen = Alpha)', 'outline-danger');
      return h;
    }
    function draw() {
      if (!el.isConnected) return;
      const harian = d.kelas.filter(k => k.mode !== 'MAPEL');
      const dibuka = harian.filter(k => k.sesi).length;
      const hadir = harian.reduce((a, k) => a + (k.sesi ? k.sesi.hadir : 0), 0);
      const telat = harian.reduce((a, k) => a + (k.sesi ? k.sesi.terlambat : 0), 0);
      const siswa = harian.reduce((a, k) => a + k.total, 0);
      el.innerHTML = pageHead('Absen Harian', tglPanjang(d.tanggal) + ' · Jam masuk ' + d.jam_masuk + ' (toleransi ' + d.toleransi + ' menit) · ditutup otomatis ' + d.jam_tutup,
        (d.boleh_semua && !d.libur ? '<button class="btn btn-primary btn-sm" data-act="semua"><i class="bi bi-play-circle"></i> Buka semua kelas</button>' +
          '<button class="btn btn-success btn-sm" data-act="gerbang"><i class="bi bi-door-open"></i> Scan Kartu Gerbang</button>' : '') +
        (S.user.role === 'admin' ? '<button class="btn btn-outline-secondary btn-sm" data-act="libur"><i class="bi bi-calendar-x"></i> Hari Libur</button>' : '') +
        '<button class="btn btn-light btn-sm" data-act="reload"><i class="bi bi-arrow-clockwise"></i></button>') +
        (d.libur ? '<div class="alert alert-warning"><i class="bi bi-calendar-x"></i> ' + esc(d.libur) + '. Absen harian tidak dibuka hari ini.</div>' : '') +
        (!d.kelas.length ? '<div class="card"><div class="card-body">' + emptyState('Anda bukan wali kelas atau petugas piket. Hubungi admin bila perlu akses absen harian.', 'calendar-day') + '</div></div>' :
        '<div class="row g-2 mb-3">' +
        statCard('door-open', 'Kelas dibuka', dibuka + ' / ' + harian.length, 'primary', 'col-6 col-md-3') +
        statCard('person-check', 'Siswa hadir', hadir + ' / ' + siswa, 'success', 'col-6 col-md-3') +
        statCard('alarm', 'Terlambat', telat, 'warning', 'col-6 col-md-3') +
        statCard('hourglass-split', 'Belum absen', harian.reduce((a, k) => a + (k.sesi ? Math.max(0, k.total - k.sesi.tercatat) : k.total), 0), 'secondary', 'col-6 col-md-3') + '</div>' +
        '<div class="card"><div class="card-body">' + tableHtml([
          { h: 'Kelas', f: k => '<b>' + esc(k.nama_kelas) + '</b><div class="small text-muted">Wali: ' + esc(k.wali || '-') + '</div>' },
          { h: 'Mode', f: k => badge(MODE_LABEL[k.mode], k.mode === 'MAPEL' ? 'light' : 'info') + (k.boleh_mode ? ' <a href="#" class="small" data-act="mode" data-id="' + k.id + '">ubah</a>' : '') },
          { h: 'Status', f: k => k.mode === 'MAPEL' ? '-' : !k.sesi ? badge('Belum dibuka', 'light') : badge(k.sesi.status, null, k.sesi.status === 'AKTIF' ? 'Dibuka' : k.sesi.status === 'SELESAI' ? 'Ditutup' : k.sesi.status) +
            '<div class="small text-muted">' + esc(METODE_LABEL[k.sesi.metode] || k.sesi.metode) + '</div>' },
          { h: 'Hadir', f: k => k.sesi ? '<b>' + k.sesi.hadir + '</b>/' + k.total + (k.sesi.terlambat ? ' <span class="small text-warning">(' + k.sesi.terlambat + ' terlambat)</span>' : '') : (k.mode === 'MAPEL' ? '-' : '0/' + k.total) },
          { h: '', cls: 'text-end text-nowrap', f: aksi }
        ], d.kelas) + '</div></div>' +
        '<div class="small text-muted mt-2"><i class="bi bi-info-circle"></i> Terlambat dihitung dari jam masuk sekolah, bukan dari kapan absen dibuka. ' +
        'Absen yang belum ditutup akan ditutup otomatis pukul ' + esc(d.jam_tutup) + ' dan siswa yang belum absen tercatat Alpha (bisa diubah manual di Daftar hadir untuk Izin/Sakit).</div>');
    }
    const bukaDlg = (judul, data) => formModal({
      title: judul, values: { metode: d.metode_default },
      intro: '<p class="small text-muted mb-2">Siswa dapat absen sampai pukul <b>' + esc(d.jam_tutup) + '</b>. Lewat pukul ' + esc(d.jam_masuk) + ' + ' + d.toleransi + ' menit tercatat Terlambat.</p>',
      fields: [{ name: 'metode', label: 'Cara absen', type: 'select', placeholder: false, options: METODE_OPSI }],
      submitText: 'Buka',
      onSubmit: async f => {
        const r = await api('bukaHarian', Object.assign({ metode: f.metode }, data));
        toast(r.dibuka.length ? 'Absen harian dibuka: ' + r.dibuka.map(x => x.kelas).join(', ') : 'Tidak ada kelas baru yang dibuka', r.dibuka.length ? 'success' : 'warning');
        if (r.dilewati.length) toast('Dilewati: ' + r.dilewati.map(x => x.kelas + ' (' + x.alasan + ')').join(', '), 'info');
        load();
      }
    });
    bindActs(el, {
      reload: () => load(),
      semua: () => bukaDlg('Buka Absen Harian Semua Kelas', { semua: true }),
      buka: id => bukaDlg('Buka Absen Harian ' + d.kelas.find(k => k.id === id).nama_kelas, { kelas_id: id }),
      gerbang: () => navigate('scanKartu', { gerbang: true }),
      qr: id => navigate('qrDisplay', { id, dari: 'absenHarian' }),
      kartu: id => navigate('scanKartu', { id, dari: 'absenHarian' }),
      kiosk: id => navigate('kiosk', { id, dari: 'absenHarian' }),
      detail: id => navigate('detailSesi', { id, dari: 'absenHarian' }),
      tutup: async id => {
        if (!await confirmDlg('Tutup absen harian sekarang? Siswa yang belum absen langsung tercatat <b>Alpha</b>.', 'Tutup', 'danger')) return;
        const r = await api('closeSesi', { id }); toast('Ditutup. ' + r.alpha + ' siswa tercatat Alpha.', 'success'); load();
      },
      mode: id => {
        const k = d.kelas.find(x => x.id === id);
        formModal({
          title: 'Mode Absensi ' + k.nama_kelas, values: { mode: k.mode },
          intro: '<p class="small text-muted">Sebaiknya ditentukan di awal semester. Bila diganti di tengah semester, persentase kehadiran di laporan mengikuti mode terbaru.</p>',
          fields: [{ name: 'mode', label: 'Mode', type: 'select', placeholder: false, options: MODE_OPSI }],
          onSubmit: async f => { await api('setModeKelas', { kelas_id: id, mode: f.mode }); toast('Mode absensi ' + k.nama_kelas + ': ' + MODE_LABEL[f.mode], 'success'); S.master = null; load(); }
        });
      },
      libur: () => liburDlg()
    });
    await load();
    every(() => { if (!document.hidden && !$('.modal.show')) load(true).catch(() => { }); }, 30000);
  }
};
