      { h: 'Tanggal', f: r => tglPanjang(r.tanggal) },
      { h: 'Keterangan', f: r => esc(r.keterangan || '-') },
      { h: '', cls: 'text-end', f: r => '<button type="button" class="btn btn-sm btn-outline-danger" data-hapus="' + r.tanggal + '"><i class="bi bi-trash"></i></button>' }
    ], rows, { empty: 'Belum ada hari libur' });
    $$('[data-hapus]', el).forEach(b => b.onclick = async () => { await api('hapusLibur', { tanggal: b.dataset.hapus }); draw(await api('listLibur', {}, { silent: true })); });
  };
  draw(list);
  $('#lbForm', el).onsubmit = async e => {
    e.preventDefault();
    const r = await api('saveLibur', readForm(e.target));
    toast(r.jumlah + ' hari libur disimpan', 'success'); e.target.reset();
    draw(await api('listLibur', {}, { silent: true }));
  };
}
</script>

<script>
/* =============================================================
 * ViewsJadwal.html — Jadwal Pelajaran (per semester)
 *  - Admin: susun jadwal (grid mingguan per kelas / per guru), impor dari Excel, kosongkan
 *  - Guru : "Jadwal Saya" (baca saja) + panel "Jadwal Hari Ini" dengan tombol Mulai sekali ketuk
 *  - Siswa: jadwal hari ini di beranda
 * ============================================================= */

const NAMA_HARI = ['', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

/** Jam dari sel Excel/teks → 'HH:MM' (Excel menyimpan jam sebagai pecahan hari atau objek Date) */
function jamSel(v) {
  if (v instanceof Date) return String(v.getHours()).padStart(2, '0') + ':' + String(v.getMinutes()).padStart(2, '0');
  if (typeof v === 'number' && v >= 0 && v < 1) { const m = Math.round(v * 1440); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  return String(v == null ? '' : v).trim();
}

/** Halaman layar sesi sesuai metode absen */
function bukaLayarSesi(id, metode, dari) {
  navigate(metode === 'FACE' ? 'kiosk' : metode === 'KARTU' ? 'scanKartu' : 'qrDisplay', { id, dari });
}

/* ---------------- PANEL "JADWAL HARI INI" (dashboard guru & Absen Mapel) ---------------- */
async function jadwalHariIniBox(box, dari) {
  if (!box) return;
  let semua = false, d = null;
  const metode = () => store.get('metodeJadwal') || 'QR_KARTU';
  async function load(diam) {
    try { d = await api('jadwalHariIni', { semua }, { silent: true, quiet: !!diam }); } catch (e) { if (!d) box.innerHTML = ''; return; }
    draw();
  }
  function status(i) {
    const x = i.sesi;
    if (i.mode_kelas === 'HARIAN') return '<span class="small text-muted">Kelas memakai absen harian</span>';
    if (x) {
      return badge(x.status, null, x.status === 'AKTIF' ? 'Dibuka' : x.status === 'SELESAI' ? 'Selesai' : x.status) + ' <span class="small"><b>' + x.hadir + '</b>/' + x.total + ' hadir</span>' +
        '<div class="mt-1">' +
        (x.status === 'AKTIF' && metodeBoleh(x.metode, 'QR') ? actBtn('jqr', x.id, 'qr-code', 'Tampilkan QR', 'outline-primary') + ' ' : '') +
        (x.status === 'AKTIF' && metodeBoleh(x.metode, 'KARTU') ? actBtn('jkartu', x.id, 'upc-scan', 'Scan kartu', 'outline-success') + ' ' : '') +
        (x.status === 'AKTIF' && metodeBoleh(x.metode, 'FACE') ? actBtn('jkiosk', x.id, 'person-bounding-box', 'Kiosk wajah', 'outline-primary') + ' ' : '') +
        actBtn('jdetail', x.id, 'list-check', 'Daftar hadir') + '</div>';
    }
    if (d.libur) return '<span class="small text-muted">Libur</span>';
    if (i.fase === 'BISA') return '<button class="btn btn-sm ' + (i.milik ? 'btn-primary' : 'btn-outline-warning') + '" data-act="jmulai" data-id="' + i.id + '"><i class="bi bi-play-fill"></i> ' + (i.milik ? 'Mulai' : 'Gantikan') + '</button>';
    if (i.fase === 'NANTI') return '<span class="small text-muted">Bisa dimulai 15 menit sebelum ' + esc(i.jam_mulai) + '</span>';
    return badge('Tidak dibuka', 'secondary');
  }
  function draw() {
    if (!box.isConnected) return;
    const items = d.items;
    box.innerHTML = '<div class="card"><div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">' +
      '<span><i class="bi bi-calendar-week"></i> Jadwal ' + (semua ? 'Semua Guru' : 'Saya') + ' Hari Ini · ' + esc(d.hari) + '</span>' +
      '<span class="d-flex gap-2 align-items-center"><a href="#" class="small" data-act="jmetode" title="Cara absen saat menekan Mulai"><i class="bi bi-sliders"></i> ' + esc(METODE_LABEL[metode()] || metode()) + '</a>' +
      (S.user.role === 'guru' ? '<button class="btn btn-sm btn-outline-secondary" data-act="jsemua">' + (semua ? 'Jadwal saya' : 'Gantikan guru lain') + '</button>' : '') + '</span></div>' +
      '<div class="card-body p-2">' + (d.libur ? '<div class="alert alert-warning small py-2 mb-2">' + esc(d.libur) + '</div>' : '') +
      (items.length ? '<div class="table-responsive"><table class="table table-sm align-middle mb-0"><tbody>' + items.map(i =>
        '<tr class="' + (i.fase === 'BISA' && !i.sesi ? 'table-primary' : '') + '"><td class="text-nowrap fw-semibold" style="width:110px">' + esc(i.jam_mulai + '–' + i.jam_selesai) + '</td>' +
        '<td><b>' + esc(i.kelas) + '</b> · ' + esc(i.mapel) + (i.ruang ? ' <span class="small text-muted">(' + esc(i.ruang) + ')</span>' : '') +
        (!i.milik ? '<div class="small text-muted">Guru: ' + esc(i.guru) + (i.sesi ? ' · dibuka oleh ' + esc(i.sesi.pembuka) : '') + '</div>' : '') + '</td>' +
        '<td class="text-end">' + status(i) + '</td></tr>').join('') + '</tbody></table></div>'
        : '<div class="text-muted small p-2">' + (semua ? 'Tidak ada jadwal pelajaran hari ini.' : 'Tidak ada jam mengajar Anda hari ini.') + '</div>') +
      '</div></div>';
  }
  async function mulai(id) {
    const i = d.items.find(x => x.id === id);
    if (!i.milik && S.user.role !== 'admin' && !await confirmDlg('Gantikan <b>' + esc(i.guru) + '</b> mengajar <b>' + esc(i.kelas + ' · ' + i.mapel) + '</b> (' + esc(i.jam_mulai + '–' + i.jam_selesai) + ')? Anda tercatat sebagai pembuka sesi.', 'Ya, gantikan')) return;
    const r = await api('mulaiJadwal', { jadwal_id: id, metode: metode(), pengganti: !i.milik });
    toast(r.sudah ? 'Sesi sudah dibuka sebelumnya' : 'Absen ' + i.mapel + ' ' + i.kelas + ' dibuka', 'success');
    bukaLayarSesi(r.id, r.metode, dari);
  }
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || !box.contains(b)) return;
    const a = b.dataset.act, id = b.dataset.id;
    if (!/^j/.test(a)) return;
    e.preventDefault(); e.stopPropagation();
    if (a === 'jmulai') mulai(id).catch(() => { });
    else if (a === 'jsemua') { semua = !semua; load(); }
    else if (a === 'jqr') navigate('qrDisplay', { id, dari });
    else if (a === 'jkartu') navigate('scanKartu', { id, dari });
    else if (a === 'jkiosk') navigate('kiosk', { id, dari });
    else if (a === 'jdetail') navigate('detailSesi', { id, dari });
    else if (a === 'jmetode') formModal({
      title: 'Cara absen saat menekan Mulai', values: { metode: metode() },
      intro: '<p class="small text-muted">Pilihan ini diingat di perangkat ini.</p>',
      fields: [{ name: 'metode', label: 'Metode', type: 'select', placeholder: false, options: METODE_OPSI }],
      onSubmit: async f => { store.set('metodeJadwal', f.metode); draw(); }
    });
  });
  box.innerHTML = '<div class="card"><div class="card-body text-center text-muted small py-3">Memuat jadwal hari ini…</div></div>';
  await load();
  every(() => { if (!document.hidden && !$('.modal.show')) load(true); }, 60000);
}

/* ---------------- HALAMAN JADWAL PELAJARAN ---------------- */
VIEWS.jadwal = {
  title: 'Jadwal Pelajaran',
  render: async function (el) {
    await getMaster(true);
    const admin = S.user.role === 'admin';
    let per = admin ? 'kelas' : 'guru', pilih = admin ? (store.get('jadwalKelas') || (S.master.kelas[0] || {}).id || '') : S.user.id, d = null;
    el.innerHTML = pageHead(admin ? 'Jadwal Pelajaran' : 'Jadwal Saya', 'Memuat…') + spinner();
    async function load() {
      await getMaster();
      d = await api('listJadwal', per === 'kelas' ? { kelas_id: pilih } : { guru_id: pilih }, { silent: true });
      draw();
    }
    function draw() {
      const hari = d.hari_sekolah.split(',').map(Number).filter(h => h >= 1 && h <= 7);
      d.items.forEach(j => { if (hari.indexOf(j.hari) < 0) hari.push(j.hari); });
      hari.sort();
      const opsi = per === 'kelas' ? kelasOpts() : guruOpts();
      el.innerHTML = pageHead(admin ? 'Jadwal Pelajaran' : 'Jadwal Saya', 'Semester ' + d.semester + ' · ' + d.jumlah_total + ' jam pelajaran terjadwal di semua kelas',
        admin ? '<button class="btn btn-outline-danger btn-sm" data-act="kosong"><i class="bi bi-trash"></i> Kosongkan</button>' +
          '<button class="btn btn-outline-success btn-sm" data-act="impor"><i class="bi bi-file-earmark-excel"></i> Impor</button>' +
          '<button class="btn btn-primary btn-sm" data-act="tambah"><i class="bi bi-plus-lg"></i> Tambah</button>' : '') +
        (admin ? '<div class="card mb-3"><div class="card-body py-2 d-flex flex-wrap gap-2 align-items-center">' +
          '<div class="btn-group btn-group-sm"><button class="btn ' + (per === 'kelas' ? 'btn-primary' : 'btn-outline-primary') + '" data-act="per" data-id="kelas">Per kelas</button>' +
          '<button class="btn ' + (per === 'guru' ? 'btn-primary' : 'btn-outline-primary') + '" data-act="per" data-id="guru">Per guru</button></div>' +
          '<select class="form-select form-select-sm" style="max-width:280px" id="jdPilih">' + optionsHtml(opsi, pilih, false) + '</select></div></div>' : '') +
        (d.items.length ? '' : '<div class="alert alert-info small">' + (admin ? 'Belum ada jadwal untuk pilihan ini. Klik <b>Tambah</b> atau <b>Impor</b> dari Excel.' : 'Belum ada jadwal mengajar Anda di semester ini.') + '</div>') +
        '<div class="row g-2">' + hari.map(h => {
          const isi = d.items.filter(j => j.hari === h);
          return '<div class="col-md-6 col-lg-4 col-xl-2"><div class="card h-100"><div class="card-header py-1 fw-semibold small">' + NAMA_HARI[h] + ' <span class="text-muted fw-normal">(' + isi.length + ')</span></div><div class="card-body p-2">' +
            (isi.length ? isi.map(j => '<div class="border rounded p-2 mb-2 small' + (admin ? ' jadwal-item' : '') + '"' + (admin ? ' role="button" data-act="ubah" data-id="' + j.id + '"' : '') + '>' +
              '<div class="fw-bold">' + esc(j.jam_mulai + '–' + j.jam_selesai) + '</div><div>' + esc(j.mapel) + '</div>' +
              '<div class="text-muted">' + esc(per === 'kelas' ? j.guru : j.kelas) + (j.ruang ? ' · ' + esc(j.ruang) : '') + '</div></div>').join('')
              : '<div class="text-muted small">—</div>') +
            (admin ? '<button class="btn btn-sm btn-light w-100" data-act="tambahHari" data-id="' + h + '"><i class="bi bi-plus"></i></button>' : '') + '</div></div></div>';
        }).join('') + '</div>';
      const sel = $('#jdPilih', el);
      if (sel) sel.onchange = e => { pilih = e.target.value; if (per === 'kelas') store.set('jadwalKelas', pilih); load(); };
    }
    const form = (j, preset) => {
      j = j || Object.assign({ kelas_id: per === 'kelas' ? pilih : '', guru_id: per === 'guru' ? pilih : '', hari: '1', jam_mulai: '07:00', jam_selesai: '08:20' }, preset || {});
      formModal({
        title: j.id ? 'Ubah Jadwal' : 'Tambah Jadwal', values: Object.assign({}, j, { hari: String(j.hari) }),
        fields: [
          { name: 'id', type: 'hidden' },
          { name: 'kelas_id', label: 'Kelas', type: 'select', options: kelasOpts(), required: true, col: 'col-md-6' },
          { name: 'hari', label: 'Hari', type: 'select', placeholder: false, options: [1, 2, 3, 4, 5, 6, 7].map(h => [String(h), NAMA_HARI[h]]), col: 'col-md-6' },
          { name: 'jam_mulai', label: 'Jam mulai', type: 'time', required: true, col: 'col-6 col-md-3' },
          { name: 'jam_selesai', label: 'Jam selesai', type: 'time', required: true, col: 'col-6 col-md-3' },
          { name: 'ruang', label: 'Ruang (opsional)', col: 'col-md-6' },
          { name: 'mapel_id', label: 'Mata pelajaran', type: 'select', options: mapelOpts(), required: true, col: 'col-md-6' },
          { name: 'guru_id', label: 'Guru', type: 'select', options: guruOpts(), col: 'col-md-6', help: 'Otomatis terisi guru pengampu mapel' }
        ],
        onRender: f => {
          f.mapel_id.addEventListener('change', () => { const m = S.master.mapel.find(x => x.id === f.mapel_id.value); if (m && m.guru_id) f.guru_id.value = m.guru_id; });
          if (j.id) {
            const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-outline-danger me-auto'; b.innerHTML = '<i class="bi bi-trash"></i> Hapus';
            b.onclick = async () => { if (!await confirmDlg('Hapus jadwal ' + esc(j.nama_hari + ' ' + j.jam_mulai + ' ' + j.mapel + ' (' + j.kelas + ')') + '?', 'Hapus', 'danger')) return; await api('hapusJadwal', { id: j.id }); toast('Jadwal dihapus', 'success'); load(); };
            $('#appModal .modal-footer').prepend(b);
          }
        },
        onSubmit: async v => { await api('saveJadwal', v); toast('Jadwal disimpan', 'success'); load(); }
      });
    };
    bindActs(el, {
      per: async v => { await getMaster(); per = v; pilih = v === 'kelas' ? (store.get('jadwalKelas') || (S.master.kelas[0] || {}).id || '') : ((S.master.guru.find(g => g.role === 'guru') || S.master.guru[0] || {}).id || ''); load(); },
      tambah: () => form(),
      tambahHari: h => form(null, { hari: h }),
      ubah: id => form(d.items.find(x => x.id === id)),
      impor: () => imporJadwalDlg(load),
      kosong: async () => {
        const kls = per === 'kelas' ? S.master.kelas.find(k => k.id === pilih) : null;
        formModal({
          title: 'Kosongkan Jadwal', submitText: 'Kosongkan',
          intro: '<div class="alert alert-danger small">Menghapus jadwal semester ' + esc(d.semester) + '. Riwayat absensi yang sudah tercatat tidak ikut terhapus.</div>',
          fields: [
            { name: 'lingkup', label: 'Yang dihapus', type: 'select', placeholder: false, options: (kls ? [['kelas', 'Jadwal kelas ' + kls.nama_kelas + ' saja']] : []).concat([['semua', 'SELURUH jadwal semua kelas']]) },
            { name: 'konfirmasi', label: 'Ketik HAPUS untuk konfirmasi', required: true }
          ],
          onSubmit: async f => {
            const r = await api('kosongkanJadwal', { konfirmasi: f.konfirmasi.trim().toUpperCase(), kelas_id: f.lingkup === 'kelas' ? pilih : '' });
            toast(r.dihapus + ' jadwal dihapus', 'success'); load();
          }
        });
      }
    });
    await load();
  }
};

/** Impor jadwal dari Excel/CSV atau tempel dari spreadsheet */
function imporJadwalDlg(onDone) {
  const kolom = { kelas: ['kelas', 'rombel', 'rombongan belajar'], hari: ['hari'], jam_mulai: ['jam mulai', 'mulai', 'jam_mulai', 'dari'],
    jam_selesai: ['jam selesai', 'selesai', 'jam_selesai', 'sampai'], mapel: ['mapel', 'mata pelajaran', 'pelajaran'], guru: ['guru', 'nip', 'pengajar', 'username guru'], ruang: ['ruang', 'ruangan'] };
  const urutan = ['kelas', 'hari', 'jam_mulai', 'jam_selesai', 'mapel', 'guru', 'ruang'];
  let baris = [];
  const el = modal({
    title: 'Impor Jadwal Pelajaran', size: 'xl',
    body: '<p class="small mb-2">Siapkan tabel dengan kolom berikut (baris judul boleh ada, urutan bebas bila ada judul). Hari: Senin–Minggu. Guru: username/NIP atau nama persis seperti di aplikasi.</p>' +
      '<div class="table-responsive"><table class="table table-sm table-bordered small mb-2"><tr class="table-light"><th>Kelas</th><th>Hari</th><th>Jam Mulai</th><th>Jam Selesai</th><th>Mapel</th><th>Guru</th><th>Ruang</th></tr>' +
      '<tr><td>VII-A</td><td>Senin</td><td>07:30</td><td>08:50</td><td>Matematika</td><td>198501012010</td><td>R.7A</td></tr>' +
      '<tr><td>VII-A</td><td>Senin</td><td>08:50</td><td>10:10</td><td>Bahasa Indonesia</td><td>Siti Aminah, S.Pd.</td><td></td></tr></table></div>' +
      '<div class="row g-2 mb-2"><div class="col-md-6"><label class="form-label small fw-semibold mb-1">File Excel / CSV</label><input type="file" class="form-control" id="ijFile" accept=".xlsx,.xls,.csv"></div>' +
      '<div class="col-md-6"><label class="form-label small fw-semibold mb-1">…atau tempel dari spreadsheet</label><textarea id="ijText" class="form-control font-monospace small" rows="2" placeholder="Tempel di sini…"></textarea></div></div>' +
      '<div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="ijGanti"><label class="form-check-label small" for="ijGanti">Ganti seluruh jadwal semester ini (hapus jadwal lama lalu impor)</label></div>' +
      '<div class="small text-muted mb-2">Kelas harus sudah ada. Mapel yang belum ada dibuat otomatis. Baris yang bentrok (kelas/guru di jam yang sama) dilewati dengan keterangan.</div>' +
      '<div id="ijPrev" class="small"></div><div id="ijRes" class="mt-2"></div>',
    footer: '<button class="btn btn-light" data-bs-dismiss="modal">Tutup</button><button class="btn btn-primary" id="ijGo" disabled><i class="bi bi-upload"></i> Impor</button>'
  });
  const siapkan = aoa => {
    aoa = aoa.filter(r => r.some(c => String(c == null ? '' : c).trim() !== ''));
    let map = null;
    if (aoa.length) {
      const head = aoa[0].map(c => String(c == null ? '' : c).trim().toLowerCase());
      const m = {}; Object.keys(kolom).forEach(k => { const i = head.findIndex(h => kolom[k].indexOf(h) >= 0); if (i >= 0) m[k] = i; });
      if (m.kelas !== undefined && m.hari !== undefined) { map = m; aoa = aoa.slice(1); }
    }
    if (!map) { map = {}; urutan.forEach((k, i) => map[k] = i); }
    baris = aoa.map(r => { const o = {}; urutan.forEach(k => { const v = map[k] === undefined ? '' : r[map[k]]; o[k] = k.indexOf('jam') === 0 ? jamSel(v) : String(v == null ? '' : v).trim(); }); return o; });
    $('#ijPrev', el).innerHTML = baris.length ? '<b>' + baris.length + ' baris siap diimpor.</b> Contoh: ' + baris.slice(0, 3).map(b => esc(b.kelas + ' ' + b.hari + ' ' + b.jam_mulai + '–' + b.jam_selesai + ' ' + b.mapel)).join(' · ') : '<span class="text-danger">Tidak ada baris terbaca.</span>';
    $('#ijGo', el).disabled = !baris.length;
  };
  $('#ijFile', el).onchange = async e => { const f = e.target.files[0]; if (!f) return; try { siapkan(await bacaFileTabel(f, true)); } catch (err) { toast('File tidak dapat dibaca: ' + err.message, 'danger'); } };
  $('#ijText', el).oninput = e => siapkan(parseTSV(e.target.value));
  $('#ijGo', el).onclick = async () => {
    const ganti = $('#ijGanti', el).checked;
    const btn = $('#ijGo', el); btn.disabled = true;
    try {
      const r = await api('importJadwal', { rows: baris, ganti });
      $('#ijRes', el).innerHTML = '<div class="alert alert-success small py-2 mb-2">' + r.ditambah + ' jadwal ditambahkan' + (r.mapel_baru ? ', ' + r.mapel_baru + ' mapel baru dibuat' : '') + '.</div>' +
        (r.errors.length ? '<div class="alert alert-warning small py-2" style="max-height:200px;overflow:auto"><b>' + r.errors.length + ' baris dilewati:</b><br>' + r.errors.map(esc).join('<br>') + '</div>' : '');
      await getMaster(true); if (onDone) onDone();
    } finally { btn.disabled = false; }
  };
}
</script>

<script>
/* =============================================================

 * ============================================================= */

const TIPE_LABEL = { PG: 'Pilihan Ganda', BS: 'Benar/Salah', ESAI: 'Esai' };

/* ---------------- BANK SOAL ---------------- */
VIEWS.bankSoal = {
  title: 'Bank Soal',
  render: async function (el) {
    await getMaster();
    // tingkat: '' = semua soal, 'umum' = soal tanpa tingkat, '7' = kelas VII …
    let mapel = store.get('lastMapel') || '', tingkat = store.get('lastTingkat') || '', rows = [], q = '';
    const pilih = new Set();
    el.innerHTML = pageHead('Bank Soal', 'Soal per mata pelajaran dan tingkat kelas. Ujian kelas VII hanya mengambil soal Kelas VII ditambah soal Umum.',
      '<button class="btn btn-outline-primary btn-sm" data-act="import"><i class="bi bi-upload"></i> Import</button>' +
      '<button class="btn btn-primary btn-sm" data-act="add"><i class="bi bi-plus-lg"></i> Tambah Soal</button>') +
      '<div class="card mb-3"><div class="card-body row g-2"><div class="col-md-4"><select class="form-select" id="bMapel">' + optionsHtml(mapelOpts(), mapel, '— pilih mata pelajaran —') + '</select></div>' +
      '<div class="col-md-3"><select class="form-select" id="bTingkat"></select></div>' +
      '<div class="col-md-3"><input class="form-control" id="bQ" placeholder="Cari teks soal…"></div><div class="col-md-2 align-self-center small text-muted" id="bCount"></div></div></div>' +
      '<div id="bBar" class="alert alert-primary py-2 small d-flex flex-wrap align-items-center gap-2" style="display:none!important"></div>' +
      '<div id="bList"></div>';
    const cocok = r => !tingkat || (tingkat === 'umum' ? !r.tingkat : String(r.tingkat) === tingkat);
    function drawTingkat() {
      const n = t => rows.filter(r => t === 'umum' ? !r.tingkat : String(r.tingkat) === t).length;
      const lain = [...new Set(rows.map(r => r.tingkat).filter(Boolean).map(String))];
      const opts = tingkatOpts(); lain.forEach(t => { if (!opts.some(o => o[0] === t)) opts.push([t, 'Kelas ' + romawi(t)]); });
      opts.sort((a, b) => a[0] - b[0]);
      $('#bTingkat', el).innerHTML = '<option value="">Semua tingkat' + (mapel ? ' (' + rows.length + ')' : '') + '</option>' +
        opts.map(o => '<option value="' + o[0] + '"' + (o[0] === tingkat ? ' selected' : '') + '>' + esc(o[1]) + (mapel ? ' (' + n(o[0]) + ')' : '') + '</option>').join('') +
        '<option value="umum"' + (tingkat === 'umum' ? ' selected' : '') + '>Umum – semua tingkat' + (mapel ? ' (' + n('umum') + ')' : '') + '</option>';
      // pilihan tersimpan yang sudah tidak ada (mis. tingkat dihapus) → kembali ke "Semua tingkat"
      if ($('#bTingkat', el).value !== tingkat) { tingkat = $('#bTingkat', el).value; store.set('lastTingkat', tingkat); }
    }
    async function load() {
      pilih.clear();
      if (!mapel) { rows = []; drawTingkat(); drawBar(); $('#bList', el).innerHTML = emptyState('Pilih mata pelajaran terlebih dahulu', 'journal'); $('#bCount', el).textContent = ''; return; }
      $('#bList', el).innerHTML = spinner();
      rows = await api('listSoal', { mapel_id: mapel }, { silent: true });
      drawTingkat(); draw();
    }
    function drawBar() {
      const bar = $('#bBar', el);
      if (!pilih.size) { bar.style.setProperty('display', 'none', 'important'); return; }
      bar.style.removeProperty('display');
      bar.innerHTML = '<b>' + pilih.size + ' soal dipilih</b><span>Pindahkan ke:</span>' +
        '<select class="form-select form-select-sm w-auto" id="bPindahKe">' + optionsHtml(tingkatOpts(), '', false) + '<option value="">Umum – semua tingkat</option></select>' +
        '<button class="btn btn-sm btn-primary" data-act="pindah"><i class="bi bi-arrow-left-right"></i> Pindahkan</button>' +
        '<button class="btn btn-sm btn-light" data-act="batal">Batal pilih</button>';
    }
    function draw() {
      const list = rows.filter(r => cocok(r) && (!q || r.pertanyaan.toLowerCase().includes(q)));
      $('#bCount', el).textContent = list.length + ' soal';
      const semua = list.length && list.every(r => pilih.has(r.id));
      $('#bList', el).innerHTML = list.length ? '<div class="form-check small mb-2 ms-1"><input class="form-check-input" type="checkbox" id="bAll"' + (semua ? ' checked' : '') + '>' +
        '<label class="form-check-label" for="bAll">Pilih semua soal yang tampil (untuk dipindah tingkatnya)</label></div>' + list.map((r, i) => {
        let opsi = '';
        if (r.tipe === 'PG') opsi = ['A', 'B', 'C', 'D', 'E'].filter(k => r['opsi_' + k.toLowerCase()]).map(k =>
          '<div class="' + (r.kunci === k ? 'kunci' : '') + '">' + k + '. ' + esc(r['opsi_' + k.toLowerCase()]) + (r.kunci === k ? ' <i class="bi bi-check-lg"></i>' : '') + '</div>').join('');
        else if (r.tipe === 'BS') opsi = '<div class="kunci">Kunci: ' + (r.kunci === 'B' ? 'Benar' : 'Salah') + '</div>';
        else opsi = '<div class="text-muted"><i>Pedoman: ' + esc(r.kunci || '-') + '</i></div>';
        return '<div class="card soal-card mb-2"><div class="card-body"><div class="d-flex gap-2 align-items-start">' +
          '<input class="form-check-input mt-1 b-pilih" type="checkbox" data-id="' + esc(r.id) + '"' + (pilih.has(r.id) ? ' checked' : '') + ' title="Pilih">' +
          '<span class="badge text-bg-light border">' + (i + 1) + '</span>' +
          '<div class="flex-grow-1"><div class="mb-1">' + badge(TIPE_LABEL[r.tipe], 'info') + ' ' + badge(tingkatLabel(r.tingkat), r.tingkat ? 'primary' : 'secondary') +
          ' <span class="small text-muted">bobot ' + esc(r.bobot) + '</span></div>' +
          '<div style="white-space:pre-wrap">' + esc(r.pertanyaan) + '</div>' + (r.gambar_url ? '<img src="' + esc(driveImg(r.gambar_url)) + '" class="img-fluid rounded my-2" style="max-height:160px">' : '') +
          '<div class="opsi mt-2">' + opsi + '</div></div><div class="text-nowrap">' + actBtn('edit', r.id, 'pencil', 'Ubah') + ' ' + actBtn('del', r.id, 'trash', 'Hapus', 'outline-danger') + '</div></div></div></div>';
      }).join('') : emptyState(rows.length ? 'Tidak ada soal untuk pilihan ini' : 'Belum ada soal untuk mapel ini');
      const all = $('#bAll', el);
      if (all) all.onchange = e => { list.forEach(r => e.target.checked ? pilih.add(r.id) : pilih.delete(r.id)); draw(); };
      $$('.b-pilih', el).forEach(c => c.onchange = e => { e.target.checked ? pilih.add(e.target.dataset.id) : pilih.delete(e.target.dataset.id); drawBar();
        const a = $('#bAll', el); if (a) a.checked = list.every(r => pilih.has(r.id)); });
      drawBar();
    }
    const tingkatField = () => ({ name: 'tingkat', label: 'Tingkat kelas', type: 'select', placeholder: 'Umum – semua tingkat', options: tingkatOpts(), col: 'col-md-4',
      help: 'Umum = bisa dipakai ujian semua tingkat' });
    function soalForm(r) {
      if (!mapel) return toast('Pilih mata pelajaran dulu', 'warning');
      r = Object.assign({ tipe: 'PG', bobot: 1, tingkat: /^\d+$/.test(tingkat) ? tingkat : '' }, r || {});
      const v = Object.assign({}, r, { tingkat: r.tingkat ? String(r.tingkat) : '', kunci_pg: r.tipe === 'PG' ? r.kunci : 'A', kunci_bs: r.tipe === 'BS' ? r.kunci : 'B', kunci_esai: r.tipe === 'ESAI' ? r.kunci : '' });
      formModal({
        title: r.id ? 'Ubah Soal' : 'Tambah Soal', size: 'lg', values: v,
        fields: [
          { name: 'id', type: 'hidden' },
          tingkatField(),
          { name: 'tipe', label: 'Tipe soal', type: 'select', placeholder: false, options: Object.keys(TIPE_LABEL).map(k => [k, TIPE_LABEL[k]]), col: 'col-md-4' },
          { name: 'bobot', label: 'Bobot / skor maksimal', type: 'number', min: 1, col: 'col-md-4' },
          { name: 'pertanyaan', label: 'Pertanyaan', type: 'textarea', rows: 4, required: true },
          { name: 'gambar_url', label: 'URL gambar (opsional)', help: 'Link gambar publik atau link Google Drive (bagikan: siapa saja yang memiliki link)' },
          { name: 'opsi_a', label: 'Opsi A', col: 'col-md-6' }, { name: 'opsi_b', label: 'Opsi B', col: 'col-md-6' },
          { name: 'opsi_c', label: 'Opsi C', col: 'col-md-6' }, { name: 'opsi_d', label: 'Opsi D', col: 'col-md-6' },
          { name: 'opsi_e', label: 'Opsi E (opsional)', col: 'col-md-6' },
          { name: 'kunci_pg', label: 'Kunci jawaban', type: 'select', placeholder: false, options: ['A', 'B', 'C', 'D', 'E'].map(k => [k, k]), col: 'col-md-6' },
          { name: 'kunci_bs', label: 'Kunci jawaban', type: 'select', placeholder: false, options: [['B', 'Benar'], ['S', 'Salah']], col: 'col-md-6' },
          { name: 'kunci_esai', label: 'Pedoman / kunci jawaban esai (hanya untuk guru)', type: 'textarea', rows: 2 }
        ],
        onRender: form => {
          const t = () => {
            const tp = form.tipe.value;
            ['opsi_a', 'opsi_b', 'opsi_c', 'opsi_d', 'opsi_e', 'kunci_pg'].forEach(n => showField(form, n, tp === 'PG'));
            showField(form, 'kunci_bs', tp === 'BS'); showField(form, 'kunci_esai', tp === 'ESAI');
          };
          form.tipe.onchange = t; t();
        },
        onSubmit: async d => {
          d.mapel_id = mapel;
          d.kunci = d.tipe === 'PG' ? d.kunci_pg : d.tipe === 'BS' ? d.kunci_bs : d.kunci_esai;
          await api('saveSoal', d); toast('Soal disimpan', 'success'); load();
        }
      });
    }
    function importDlg() {
      if (!mapel) return toast('Pilih mata pelajaran dulu', 'warning');
      const nmMapel = (mapelOpts().find(m => m[0] === mapel) || [, ''])[1];
      const el2 = modal({
        title: 'Import Soal – ' + nmMapel, size: 'xl',
        body: '<div class="row g-2 align-items-end mb-3"><div class="col-md-4"><label class="form-label small fw-semibold mb-1" for="sqTingkat">Masukkan ke tingkat</label>' +
          '<select class="form-select" id="sqTingkat">' + optionsHtml(tingkatOpts(), /^\d+$/.test(tingkat) ? tingkat : '', 'Umum – semua tingkat') + '</select></div>' +
          '<div class="col-md-8 small text-muted">Dipakai untuk semua baris. Baris yang kolom <b>tingkat</b>-nya diisi (VII / VIII / IX atau 7 / 8 / 9) mengikuti isi kolom itu.</div></div>' +
          '<p class="small mb-2">Buat tabel di Google Sheets/Excel dengan kolom berikut, blok semua baris, salin, lalu tempel di bawah. Kolom <b>tingkat</b> boleh dikosongkan atau tidak ada.</p>' +
          '<div class="table-responsive"><table class="table table-sm table-bordered small"><tr class="table-light"><th>tipe</th><th>pertanyaan</th><th>opsi_a</th><th>opsi_b</th><th>opsi_c</th><th>opsi_d</th><th>opsi_e</th><th>kunci</th><th>bobot</th><th>gambar_url</th><th>tingkat</th></tr>' +
          '<tr><td>PG</td><td>2 + 3 = …</td><td>4</td><td>5</td><td>6</td><td>7</td><td></td><td>B</td><td>1</td><td></td><td>VII</td></tr>' +
          '<tr><td>BS</td><td>Matahari terbit dari timur.</td><td></td><td></td><td></td><td></td><td></td><td>B</td><td>1</td><td></td><td></td></tr>' +
          '<tr><td>ESAI</td><td>Jelaskan fotosintesis!</td><td></td><td></td><td></td><td></td><td></td><td>pedoman jawaban</td><td>5</td><td></td><td>8</td></tr></table></div>' +
          '<textarea id="sqText" class="form-control font-monospace small" rows="8" placeholder="Tempel di sini…"></textarea><div id="sqRes" class="mt-2"></div>',
        footer: '<button class="btn btn-light" data-bs-dismiss="modal">Tutup</button><button class="btn btn-primary" id="sqGo"><i class="bi bi-upload"></i> Import</button>'
      });
      $('#sqGo', el2).onclick = async () => {
        let lines = parseTSV($('#sqText', el2).value);
        if (lines.length && lines[0][0].toLowerCase() === 'tipe') lines = lines.slice(1);
        if (!lines.length) return toast('Data kosong', 'warning');
        const btn = $('#sqGo', el2); btn.disabled = true;
        try {
          const r = await api('importSoal', {
            mapel_id: mapel, tingkat: $('#sqTingkat', el2).value,
            rows: lines.map(c => ({ tipe: c[0], pertanyaan: c[1], opsi_a: c[2], opsi_b: c[3], opsi_c: c[4], opsi_d: c[5], opsi_e: c[6], kunci: c[7], bobot: c[8], gambar_url: c[9], tingkat: c[10] || '' }))
          });
          $('#sqRes', el2).innerHTML = '<div class="alert alert-success small py-2">' + r.added + ' soal berhasil diimpor.</div>' +
            (r.errors.length ? '<div class="alert alert-warning small py-2" style="max-height:160px;overflow:auto">' + r.errors.map(esc).join('<br>') + '</div>' : '');
          load();
        } finally { btn.disabled = false; }
      };
    }
    bindActs(el, {
      add: () => soalForm(), import: importDlg,
      edit: id => soalForm(rows.find(r => r.id === id)),
      del: async id => { if (await confirmDlg('Hapus soal ini dari bank soal?', 'Hapus', 'danger')) { await api('deleteSoal', { id }); toast('Soal dihapus', 'success'); load(); } },
      batal: () => { pilih.clear(); draw(); },
      pindah: async () => {
        const ke = $('#bPindahKe', el).value;
        const r = await api('pindahTingkatSoal', { ids: [...pilih], tingkat: ke });
        toast(r.jumlah + ' soal dipindah ke ' + tingkatLabel(r.tingkat), 'success'); load();
      }
    });
    $('#bMapel', el).onchange = e => { mapel = e.target.value; store.set('lastMapel', mapel); load(); };
    $('#bTingkat', el).onchange = e => { tingkat = e.target.value; store.set('lastTingkat', tingkat); pilih.clear(); draw(); };
    $('#bQ', el).oninput = e => { q = e.target.value.toLowerCase(); draw(); };
    load();
  }
};

VIEWS.ujianGuru = {
  title: 'Ujian / CBT',
  render: async function (el) {
    await getMaster();

    el.innerHTML = pageHead('Ujian / CBT', 'Kuis bulanan, UTS, dan UAS berbasis komputer/HP',
      '<button class="btn btn-light btn-sm" data-act="reload"><i class="bi bi-arrow-clockwise"></i></button>' +

        { h: 'Status', f: u => badge(u.fase, STATUS_COLOR[u.fase], FASE_LABEL[u.fase]) },
        { h: '', cls: 'text-end text-nowrap', f: u => actBtn('mon', u.id, 'display', 'Monitoring', 'primary') + ' ' + actBtn('esai', u.id, 'pencil', 'Nilai esai') + ' ' +

        maks_pelanggaran: S.settings.maks_pelanggaran_default || 3, tanggal_mulai: loc(now), tanggal_selesai: loc(new Date(now.getTime() + 2 * 3600000))
      };
      formModal({
        title: u ? 'Ubah Ujian' : 'Buat Ujian', size: 'lg', values: v,
        fields: [
          { name: 'id', type: 'hidden' },
          { name: 'judul', label: 'Judul ujian', required: true, placeholder: 'mis. Kuis Bulanan November – Matematika' },
          { name: 'jenis', label: 'Jenis', type: 'select', placeholder: false, options: Object.keys(JENIS_LABEL).map(k => [k, JENIS_LABEL[k]]), col: 'col-md-4' },
          { name: 'kelas_id', label: 'Kelas', type: 'select', options: kelasOpts(), required: true, col: 'col-md-4' },
          { name: 'mapel_id', label: 'Mapel (sumber bank soal)', type: 'select', options: mapelOpts(), required: true, col: 'col-md-4' },
          { name: '_infoSoal', type: 'html', html: '<div id="ujInfoSoal" class="small text-muted mb-2"></div>' },
          { name: 'tanggal_mulai', label: 'Dibuka mulai', type: 'datetime-local', required: true, col: 'col-md-6' },
          { name: 'tanggal_selesai', label: 'Ditutup pada', type: 'datetime-local', required: true, col: 'col-md-6' },
          { name: 'durasi_menit', label: 'Durasi pengerjaan (menit)', type: 'number', min: 1, required: true, col: 'col-md-4' },
          { name: 'jumlah_soal', label: 'Jumlah soal', type: 'number', min: 1, required: true, col: 'col-md-4' },
          { name: 'maks_pelanggaran', label: 'Batas pelanggaran (0 = tidak dikunci)', type: 'number', min: 0, col: 'col-md-4' },
          { name: 'token_ujian', label: 'Token ujian', help: 'Kosongkan untuk dibuat otomatis. Bagikan token saat ujian dimulai.', col: 'col-md-6' },
          { name: 'status', label: 'Status', type: 'select', placeholder: false, options: [['AKTIF', 'Aktif'], ['NONAKTIF', 'Nonaktif']], col: 'col-md-6' },
          { name: 'acak_soal', label: 'Acak urutan soal per siswa', type: 'checkbox', col: 'col-md-4' },
          { name: 'acak_opsi', label: 'Acak urutan opsi jawaban', type: 'checkbox', col: 'col-md-4' },
          { name: 'tampilkan_nilai', label: 'Tampilkan nilai ke siswa', type: 'checkbox', col: 'col-md-4' }
        ],
        onRender: form => {
          let urut = 0;
          const info = async () => {
            const box = $('#ujInfoSoal'), k = form.kelas_id.value, m = form.mapel_id.value, no = ++urut;

              const r = await api('hitungSoal', { kelas_id: k, mapel_id: m }, { silent: true, quiet: true });

              const kurang = r.jumlah < (+form.jumlah_soal.value || 0);
              box.className = 'small mb-2 ' + (kurang ? 'text-danger' : 'text-success');
              box.innerHTML = '<i class="bi bi-journal-check"></i> Soal tersedia untuk kelas ini: <b>' + r.jumlah + '</b> ' +
                (r.tingkat ? '(Kelas ' + esc(romawi(r.tingkat)) + ' + Umum)' : '(kelas belum punya tingkat — hanya soal Umum)') + (kurang ? ' — kurang dari jumlah soal yang diminta' : '');
            } catch (e) { box.innerHTML = ''; }
          };
          form.kelas_id.addEventListener('change', info); form.mapel_id.addEventListener('change', info); form.jumlah_soal.addEventListener('input', info); info();
        },
        onSubmit: async d => { const r = await api('saveUjian', d); toast('Ujian disimpan. Token: ' + r.token_ujian, 'success'); load(); }
      });
    }
    bindActs(el, {
      reload: load, add: () => ujianForm(), kartuUjian: () => navigate('kartuUjian'),
      edit: id => ujianForm(rows.find(r => r.id === id)),
      mon: id => navigate('monitorUjian', { id }),
      esai: id => navigate('nilaiEsai', { id }),
      toggle: async id => { const u = rows.find(r => r.id === id); await api('setStatusUjian', { id, status: u.status === 'AKTIF' ? 'NONAKTIF' : 'AKTIF' }); load(); },

        await api('deleteUjian', { id, paksa: true }); toast('Ujian dihapus', 'success'); load();
      }
    });
    load();
  }
};

        [['BELUM', 'Belum mulai', 'secondary'], ['BERLANGSUNG', 'Mengerjakan', 'primary'], ['DIKUNCI', 'Terkunci', 'danger'], ['SELESAI', 'Selesai', 'success']].map(x =>

          { h: '#', f: (x, i) => i + 1 },

          { h: 'Status', f: x => badge(x.status, STATUS_COLOR[x.status], x.status === 'BELUM' ? 'Belum mulai' : x.status) },
          { h: 'Progres', f: x => x.total ? '<div class="progress" style="height:8px;min-width:80px"><div class="progress-bar" style="width:' + (x.terjawab / x.total * 100) + '%"></div></div><div class="small text-muted">' + x.terjawab + '/' + x.total + '</div>' : '-' },
          { h: 'Pelanggaran', f: x => (x.pelanggaran ? '<span class="badge text-bg-' + (x.pelanggaran >= u.maks_pelanggaran && u.maks_pelanggaran > 0 ? 'danger' : 'warning') + '">' + x.pelanggaran + '</span>' : (x.sesi_id ? '0' : '-')) +
            (x.total_pelanggaran > (x.pelanggaran || 0) ? '<div class="small text-muted">total ' + x.total_pelanggaran + '</div>' : '') },
          { h: 'Sisa waktu', f: x => fmtSisa(x.sisa_detik) },

            (x.status === 'DIKUNCI' ? '<button class="btn btn-sm btn-success" data-act="unlock" data-id="' + x.sesi_id + '"><i class="bi bi-unlock"></i> Buka</button> ' : '') +
            (x.status === 'BERLANGSUNG' || x.status === 'DIKUNCI' ? actBtn('time', x.sesi_id, 'clock-history', 'Tambah 10 menit') + ' ' : '') +
            actBtn('reset', x.sesi_id, 'arrow-counterclockwise', 'Reset (ulang dari awal)', 'outline-danger') }
        ], d.peserta, { empty: 'Belum ada siswa di kelas ini' }) + '</div></div>' +
        '<div class="card"><div class="card-header"><i class="bi bi-shield-exclamation text-danger"></i> Log Pelanggaran Terbaru</div><div class="card-body">' +
        tableHtml([{ h: 'Waktu', f: l => esc(l.waktu.substring(11, 19)) }, { h: 'Siswa', f: l => esc(l.nama) }, { h: 'Jenis', f: l => badge(l.jenis, l.jenis === 'UNLOCK' ? 'success' : 'warning') }, { h: 'Keterangan', f: l => esc(l.keterangan) }],
          d.logs, { empty: 'Tidak ada pelanggaran' }) + '</div></div>';
      $('#mAuto', el).onchange = e => { auto = e.target.checked; };
    }
    bindActs(el, {
      back: () => navigate('ujianGuru'), reload: () => load(),
      unlock: async id => { await api('unlockSesiUjian', { sesi_id: id }); toast('Kunci dibuka. Siswa dapat melanjutkan.', 'success'); load(); },
      time: async id => { await api('addTimeUjian', { sesi_id: id, menit: 10 }); toast('Waktu ditambah 10 menit', 'success'); load(); },
      reset: async id => {
        if (!await confirmDlg('Reset sesi ujian siswa ini? Jawabannya dihapus dan siswa mengulang dari awal dengan soal baru.', 'Reset', 'danger')) return;
        await api('resetSesiUjian', { sesi_id: id }); toast('Sesi direset', 'success'); load();
      }
    });
    await load();
    every(() => { if (auto && !document.hidden && !$('.modal.show')) load(true).catch(() => { }); }, 10000);
  }
};

          fields: [{ name: 'token', label: 'Token ujian (dari pengawas)', required: true, placeholder: 'mis. AB12CD' }],
          submitText: 'Masuk Ujian',

            const payload = await api('startUjian', { ujian_id: id, token: f.token.trim() });
